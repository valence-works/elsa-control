name: Staging Control compatibility fixture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Incompatibility mode to advertise from staging Control."
        required: true
        type: choice
        options:
          - missing-capability
          - older-contract

# Share Deploy staging's lock so a deploy cannot land mid-proof.
# GitHub keeps only one pending run per group, so dispatching this while a
# Deploy staging is already pending cancels that pending deploy (and vice versa).
concurrency:
  group: azure-api-deploy-test
  cancel-in-progress: false

jobs:
  fixture:
    name: Arm and restore the staging compatibility fixture
    runs-on: ubuntu-latest
    # Backstop above fixture-on (20m) + post-delete health (10m+) + in-hold + screens.
    timeout-minutes: 60
    environment: test
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
      issues: read
    env:
      TARGET_ENVIRONMENT: test
      FIXTURE_MODE: ${{ inputs.mode }}
      DISPATCH_MODE: ${{ inputs.mode }}
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      EXPECTED_STAGING_SUPABASE_ORIGIN: ${{ vars.EXPECTED_STAGING_SUPABASE_ORIGIN }}
      CLOUD_BFF_SMOKE_URL: ${{ vars.CLOUD_BFF_SMOKE_URL }}
      STAGING_CLOUD_ORIGIN: https://calm-sand-03964eb03.2.azurestaticapps.net
      SCREENSHOT_ROOT: ${{ github.workspace }}/staging-compat-screens
      PLAYWRIGHT_STATE_PATH: ${{ runner.temp }}/compat-playwright-session.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse any environment other than test
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DISPATCH_MODE" != "missing-capability" ] && [ "$DISPATCH_MODE" != "older-contract" ]; then
            echo "::error::The compatibility fixture mode is not recognized."
            exit 1
          fi
          if [ "$TARGET_ENVIRONMENT" != "test" ]; then
            echo "::error::The compatibility fixture can run only in the test environment."
            exit 1
          fi

      - name: Install Playwright Chromium
        id: playwright_setup
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCREENSHOT_ROOT"
          # Install next to the ESM capture script so createRequire(import.meta.url)
          # resolves `playwright` from scripts/node_modules. Do this before Azure
          # login. --ignore-scripts skips package postinstall; browsers are installed
          # explicitly afterwards.
          npm install --no-save --ignore-scripts --prefix "$GITHUB_WORKSPACE/scripts" playwright@1.49.0
          npx --prefix "$GITHUB_WORKSPACE/scripts" playwright install --with-deps chromium
          node scripts/staging-compat-fixture-screens.mjs --prove-load

      - name: Log in Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight exclusive staging and capture the baseline
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_E2E_COMPAT_EMAIL: ${{ secrets.STAGING_E2E_COMPAT_EMAIL }}
          STAGING_E2E_COMPAT_PASSWORD: ${{ secrets.STAGING_E2E_COMPAT_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/staging-compat-fixture.sh preflight

      - name: Arm the compatibility fixture on the same deployed build
        id: arm
        timeout-minutes: 12
        env:
          STAGING_E2E_COMPAT_EMAIL: ${{ secrets.STAGING_E2E_COMPAT_EMAIL }}
          STAGING_E2E_COMPAT_PASSWORD: ${{ secrets.STAGING_E2E_COMPAT_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          EXPECTED_DIGEST: ${{ steps.preflight.outputs.digest }}
          EXPECTED_BUILD_NUMBER: ${{ steps.preflight.outputs.build_number }}
          EXPECTED_COMMIT: ${{ steps.preflight.outputs.commit }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.preflight.outputs.deployment_id }}
          EXPECTED_IMAGE_REFERENCE: ${{ steps.preflight.outputs.image_reference }}
          EXPECTED_PREFLIGHT_STARTED_AT: ${{ steps.preflight.outputs.preflight_started_at }}
          HEALTH_BUDGET_SECONDS: "300"
        shell: bash
        run: |
          set -euo pipefail
          scripts/staging-compat-fixture.sh arm

      - name: Record K action probes while armed
        id: k_probes
        timeout-minutes: 2
        env:
          STAGING_E2E_COMPAT_EMAIL: ${{ secrets.STAGING_E2E_COMPAT_EMAIL }}
          STAGING_E2E_COMPAT_PASSWORD: ${{ secrets.STAGING_E2E_COMPAT_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          EXPECTED_COMPAT_CONTEXT_PATH: ${{ steps.arm.outputs.compat_context_path }}
        shell: bash
        run: |
          set -euo pipefail
          armed_at="${{ steps.arm.outputs.armed_at }}"
          if [[ ! "$armed_at" =~ ^[0-9]+$ ]]; then
            echo "::error::Arm did not record when the Web App setting was applied."
            exit 1
          fi
          now="$(date +%s)"
          elapsed=$((now - armed_at))
          if [ "$(python3 scripts/lib/staging_compat_exclusive.py skip-in-hold --elapsed-since-arm "$elapsed" --needed 120)" = skip ]; then
            echo "Skipping K probes; remaining fixture-on budget before the 20-minute cap is short."
            {
              printf '## In-hold K action probes\n\n'
              printf 'telemetry: not used (Architect ruling); no-forward evidence = elsa-cloud#144 + (a)/(b)\n\n'
              printf 'Skipped; remaining fixture-on budget before the 20-minute cap is short.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/staging-compat-fixture.sh probes

      - name: Capture armed customer screens
        id: armed_screens
        if: ${{ success() && steps.playwright_setup.outcome == 'success' }}
        timeout-minutes: 5
        env:
          STAGING_E2E_COMPAT_EMAIL: ${{ secrets.STAGING_E2E_COMPAT_EMAIL }}
          STAGING_E2E_COMPAT_PASSWORD: ${{ secrets.STAGING_E2E_COMPAT_PASSWORD }}
          SCREENSHOT_PHASE: armed
          SCREENSHOT_DIR: ${{ env.SCREENSHOT_ROOT }}/armed
        shell: bash
        run: |
          set -euo pipefail
          armed_at="${{ steps.arm.outputs.armed_at }}"
          if [[ ! "$armed_at" =~ ^[0-9]+$ ]]; then
            echo "::error::Arm did not record when the Web App setting was applied."
            exit 1
          fi
          now="$(date +%s)"
          elapsed=$((now - armed_at))
          if [ "$(python3 scripts/lib/staging_compat_exclusive.py skip-in-hold --elapsed-since-arm "$elapsed" --needed 300)" = skip ]; then
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping armed screens; remaining fixture-on budget before the 20-minute cap is short."
            {
              printf '## Armed customer screens\n\n'
              printf 'Skipped; remaining fixture-on budget before the 20-minute cap is short.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/staging-compat-fixture-screens.mjs
          echo "captured=true" >> "$GITHUB_OUTPUT"
          {
            printf '## Armed customer screens\n\n'
            printf 'Uploaded as artifact `staging-compat-screens-armed` after restore.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold the remaining exclusive proof window
        if: ${{ success() }}
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          armed_at="${{ steps.arm.outputs.armed_at }}"
          if [[ ! "$armed_at" =~ ^[0-9]+$ ]]; then
            echo "::error::Arm did not record when the Web App setting was applied."
            exit 1
          fi
          now="$(date +%s)"
          elapsed=$((now - armed_at))
          hold="$(python3 scripts/lib/staging_compat_exclusive.py hold --elapsed-since-arm "$elapsed")"
          echo "Compatibility fixture is armed on the same deployed Web App build."
          echo "Hold ${hold}s (fixture-on cap 20m minus elapsed minus reserved restore)."
          echo "Cancel this workflow to restore immediately."
          end=$((SECONDS + hold))
          while [ "$SECONDS" -lt "$end" ]; do
            sleep 30
          done

      - name: Restore the baseline
        id: restore
        # Skip when exclusive preflight failed closed: the fixture was never
        # written, and a restore restart would bounce staging during an open
        # QA window, missing freeze, or conflicting test deployment.
        # A failed password grant must not block deleting the fixture; restore
        # removes the setting before it mints.
        # In-hold check failures and cancel must not skip this step.
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_E2E_COMPAT_EMAIL: ${{ secrets.STAGING_E2E_COMPAT_EMAIL }}
          STAGING_E2E_COMPAT_PASSWORD: ${{ secrets.STAGING_E2E_COMPAT_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          EXPECTED_DIGEST: ${{ steps.preflight.outputs.digest }}
          EXPECTED_BUILD_NUMBER: ${{ steps.preflight.outputs.build_number }}
          EXPECTED_COMMIT: ${{ steps.preflight.outputs.commit }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.preflight.outputs.deployment_id }}
          EXPECTED_IMAGE_REFERENCE: ${{ steps.preflight.outputs.image_reference }}
          EXPECTED_PREFLIGHT_STARTED_AT: ${{ steps.preflight.outputs.preflight_started_at }}
          EXPECTED_SETTING_NAMES_PATH: ${{ steps.preflight.outputs.setting_names_path }}
          ARMED_AT_ISO: ${{ steps.arm.outputs.armed_at_iso }}
          HEALTH_ATTEMPTS: "36"
          HEALTH_RETRY_SECONDS: "15"
          HEALTH_CURL_MAX_TIME: "10"
          HEALTH_BUDGET_SECONDS: "600"
        shell: bash
        run: |
          set -euo pipefail
          scripts/staging-compat-fixture.sh restore

      - name: Upload armed customer screens
        if: ${{ !cancelled() && steps.armed_screens.outputs.captured == 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: staging-compat-screens-armed
          path: ${{ env.SCREENSHOT_ROOT }}/armed/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Capture restored customer screens
        id: restored_screens
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.playwright_setup.outcome == 'success' }}
        timeout-minutes: 5
        env:
          STAGING_E2E_COMPAT_EMAIL: ${{ secrets.STAGING_E2E_COMPAT_EMAIL }}
          STAGING_E2E_COMPAT_PASSWORD: ${{ secrets.STAGING_E2E_COMPAT_PASSWORD }}
          SCREENSHOT_PHASE: restored
          SCREENSHOT_DIR: ${{ env.SCREENSHOT_ROOT }}/restored
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$PLAYWRIGHT_STATE_PATH" ]; then
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping restored screens; the armed session was not captured."
            {
              printf '## Restored customer screens\n\n'
              printf 'Skipped; the armed session was not captured.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/staging-compat-fixture-screens.mjs
          echo "captured=true" >> "$GITHUB_OUTPUT"
          {
            printf '## Restored customer screens\n\n'
            printf 'Uploaded as artifact `staging-compat-screens-restored`.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload restored customer screens
        if: ${{ !cancelled() && steps.restored_screens.outputs.captured == 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: staging-compat-screens-restored
          path: ${{ env.SCREENSHOT_ROOT }}/restored/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Report skipped post-restore evidence
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.restore.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## Post-restore evidence\n\n'
            printf 'Restored customer screens were skipped because restore did not succeed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
