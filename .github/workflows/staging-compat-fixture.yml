name: Staging Control compatibility fixture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Incompatibility mode to advertise from staging Control."
        required: true
        type: choice
        options:
          - missing-capability
          - older-contract

# Share Deploy staging's lock so a deploy cannot land mid-proof.
concurrency:
  group: azure-api-deploy-test
  cancel-in-progress: false

jobs:
  fixture:
    name: Arm and restore the staging compatibility fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
      issues: read
    env:
      TARGET_ENVIRONMENT: test
      FIXTURE_MODE: ${{ inputs.mode }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse any environment other than test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.mode }}" != "missing-capability" ] && [ "${{ github.event.inputs.mode }}" != "older-contract" ]; then
            echo "::error::The compatibility fixture mode is not recognized."
            exit 1
          fi
          if [ "$TARGET_ENVIRONMENT" != "test" ]; then
            echo "::error::The compatibility fixture can run only in the test environment."
            exit 1
          fi

      - name: Log in Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight exclusive staging and capture the baseline
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/staging-compat-fixture.sh preflight

      - name: Arm the compatibility fixture on the same image digest
        id: arm
        env:
          EXPECTED_DIGEST: ${{ steps.preflight.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/staging-compat-fixture.sh arm

      - name: Hold the fixture for the exclusive proof window
        if: ${{ success() }}
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          echo "Compatibility fixture is armed on the same image digest."
          echo "Cancel this workflow to restore immediately. The job cap is 20 minutes."
          end=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$end" ]; do
            sleep 30
          done

      - name: Restore the baseline
        if: ${{ always() }}
        env:
          EXPECTED_DIGEST: ${{ steps.preflight.outputs.digest }}
          EXPECTED_SETTING_NAMES_PATH: ${{ steps.preflight.outputs.setting_names_path }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/staging-compat-fixture.sh restore
