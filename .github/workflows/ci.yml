name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  azure-proof:
    name: Azure proof and contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate CI workflow contract
        run: |
          python3 scripts/tests/test_ci_workflow.py
          python3 scripts/tests/test_issue_bus.py

      - name: Validate Azure deployment workflow contract
        run: |
          python3 scripts/tests/test_azure_api_deploy_workflow.py
          python3 scripts/tests/test_azure_api_candidate.py
          python3 scripts/tests/test_deploy_azure_elsa_control.py
          python3 scripts/tests/test_control_sql_sku.py
          python3 -m unittest scripts.tests.test_production_stripe_reconcile

      - name: Validate production Azure image and template contracts
        run: |
          python3 scripts/tests/test_azure_production_templates.py
          python3 scripts/tests/test_api_infrastructure.py
          python3 scripts/tests/test_customer_subscription_bootstrap.py
          python3 scripts/tests/test_azure_lighthouse_offer.py
          python3 scripts/tests/test_managed_telemetry_infrastructure.py
          python3 scripts/tests/test_control_deploy_identity_infrastructure.py
          python3 scripts/tests/test_control_worker_composition.py
          python3 scripts/tests/test_control_egress_infrastructure.py
          python3 scripts/tests/test_api_provider_image.py
          python3 scripts/tests/test_managed_lifecycle_slo_sampler.py
          python3 scripts/tests/test_catalog_rehearsal_harness.py
          bash -n scripts/catalog-rehearsal/run-phase.sh
          python3 scripts/tests/test_validate_api_provider_image.py

      - name: Run Azure workload proof tests
        run: |
          python3 scripts/tests/test_azure_workload_proof.py
          python3 scripts/tests/test_azure_workload_restore_proof.py

      - name: Check Azure workload proof shell scripts
        run: |
          bash -n \
            scripts/azure-workload-proof.sh \
            scripts/azure-workload-restore-proof.sh \
            scripts/lib/azure-workload-proof.sh \
            scripts/validate-azure-workload-proof.sh \
            scripts/validate-api-provider-image.sh \
            scripts/validate-azure-api-candidate.sh
          shellcheck \
            scripts/azure-workload-proof.sh \
            scripts/azure-workload-restore-proof.sh \
            scripts/lib/azure-workload-proof.sh \
            scripts/validate-azure-workload-proof.sh \
            scripts/validate-api-provider-image.sh \
            scripts/validate-azure-api-candidate.sh

      - name: Compile Azure workload proof Bicep templates
        run: |
          az bicep build --file infra/azure-workload-proof/main.bicep --stdout >/dev/null
          az bicep build --file infra/azure-workload-proof/recovery-target.bicep --stdout >/dev/null
          az bicep build --file infra/azure-workload-proof/recovery-database.bicep --stdout >/dev/null
          az bicep build --file infra/azure-workload-proof/acr-pull-role.bicep --stdout >/dev/null
          az bicep build --file infra/azure-lighthouse/v1/main.bicep --stdout >/dev/null
          az bicep build --file infra/main.bicep --stdout >/dev/null
          az bicep build --file infra/control-sql/control-sql.module.bicep --stdout >/dev/null

  api-image:
    name: Build and smoke-test API provider image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build API provider image
        run: docker build --file src/Hosting/ElsaControl.Api/Dockerfile --tag elsa-control-api-ci:${{ github.sha }} .

      - name: Smoke-test API provider image
        run: scripts/validate-api-provider-image.sh elsa-control-api-ci:${{ github.sha }}

  dotnet:
    name: Full .NET restore, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Show dotnet version
        run: dotnet --version

      - name: Restore
        run: dotnet restore ElsaControl.sln

      - name: Build
        run: dotnet build ElsaControl.sln --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          # A disposable local SQL Server exercises compatibility migrations against real SQL.
          # Generate and mask its credential; never reuse an environment/customer credential.
          export MSSQL_SA_PASSWORD="$(openssl rand -hex 24)A!1"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          sql_container="elsa-control-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force --volumes "$sql_container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$sql_container" \
            --publish 127.0.0.1::1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090 >/dev/null
          sql_ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$sql_container" sh -c \
              'exec /opt/mssql-tools18/bin/sqlcmd -S tcp:127.0.0.1,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -b -l 3 -Q "SET NOCOUNT ON; SELECT 1;"' >/dev/null 2>&1; then
              sql_ready=true
              break
            fi
            sleep 3
          done
          if [ "$sql_ready" != true ]; then
            echo "::error::Disposable SQL Server did not pass authenticated readiness."
            exit 1
          fi
          sql_port="$(docker port "$sql_container" 1433/tcp | sed 's/.*://')"
          export CODEX_664_SQL_CONNECTION="Server=127.0.0.1,$sql_port;Database=master;User ID=sa;Password=$MSSQL_SA_PASSWORD;Encrypt=False;TrustServerCertificate=True"
          echo "::add-mask::$CODEX_664_SQL_CONNECTION"
          dotnet test ElsaControl.sln --configuration Release --no-build --verbosity normal

  build:
    name: Build and Test
    if: ${{ always() }}
    needs:
      - azure-proof
      - api-image
      - dotnet
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI dependencies to pass
        env:
          AZURE_PROOF_RESULT: ${{ needs['azure-proof'].result }}
          API_IMAGE_RESULT: ${{ needs['api-image'].result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
        run: |
          set -euo pipefail
          if [ "$AZURE_PROOF_RESULT" != "success" ] \
              || [ "$API_IMAGE_RESULT" != "success" ] \
              || [ "$DOTNET_RESULT" != "success" ]; then
            echo "::error::Required CI dependencies did not all succeed (azure-proof=$AZURE_PROOF_RESULT, api-image=$API_IMAGE_RESULT, dotnet=$DOTNET_RESULT)."
            exit 1
          fi

  console:
    name: Console quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Hosting/ElsaControl.Console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Hosting/ElsaControl.Console/package-lock.json

      - name: Install locked console dependencies
        run: npm ci

      - name: Run console unit tests
        run: npm test

      - name: Typecheck console
        run: npm run typecheck

      - name: Build production console bundle
        run: npm run build
