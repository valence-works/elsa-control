name: Azure Control API Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub environment to deploy."
        required: true
        default: production
        type: choice
        options:
          - development
          - test
          - production
      deploy_mode:
        description: "Use app for code-only deployment, telemetry for the RecoveryRequired sink (RG-scoped), infra for subscription-scoped base Bicep (#705), build to stage, or promote an immutable candidate."
        required: true
        default: app
        type: choice
        options:
          - app
          - infra
          - telemetry
          - build
          - promote
      candidate_run_id:
        description: "Successful same-repository build workflow run containing the candidate descriptor (promote only)."
        required: false
        type: string
      candidate_digest:
        description: "Expected candidate image digest, including the sha256: prefix (promote only)."
        required: false
        type: string
      telemetry_action:
        description: "telemetry mode only. what-if previews only and never creates. create is a separate dispatch."
        required: true
        default: what-if
        type: choice
        options:
          - what-if
          - create
      confirm_environment:
        description: "Required for telemetry create, and for any telemetry dispatch targeting production. Must equal the target environment name."
        required: false
        type: string

concurrency:
  group: azure-api-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and Deploy Control API
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
      DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'app' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      CLOUD_ACCOUNT_ISSUER: ${{ vars.CLOUD_ACCOUNT_ISSUER }}
      EXPECTED_CLOUD_ACCOUNT_ISSUER: ${{ vars.EXPECTED_CLOUD_ACCOUNT_ISSUER }}
      CONTROL_ENTRA_CLIENT_ID: ${{ vars.CONTROL_ENTRA_CLIENT_ID }}
      CONTROL_ENTRA_TENANT_ID: ${{ vars.CONTROL_ENTRA_TENANT_ID }}
      AZURE_PROVISIONER_IDENTITY_ID: ${{ vars.AZURE_PROVISIONER_IDENTITY_ID }}
      AZURE_API_EGRESS_SUBNET_ID: ${{ vars.AZURE_API_EGRESS_SUBNET_ID }}
      # Staging (`test`) only. Production must leave this unset. Org ids are not
      # secret; do not echo the list. The Hosted smoke owner org is minted with
      # Guid.NewGuid() on first Cloud sign-in, so its id is recorded on `test`
      # as STAGING_SMOKE_OWNER_ORGANIZATION_ID rather than as a source constant.
      EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS: ${{ vars.EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS }}
      # RecoveryRequired Azure Monitor email. Staging never uses the production
      # mailbox. telemetry mode passes the matching variable into
      # scripts/deploy-managed-telemetry.sh. Infra mode does not run telemetry.
      STAGING_RECOVERY_REQUIRED_ALERT_RECIPIENT: ${{ vars.STAGING_RECOVERY_REQUIRED_ALERT_RECIPIENT }}
      PRODUCTION_RECOVERY_REQUIRED_ALERT_RECIPIENT: ${{ vars.PRODUCTION_RECOVERY_REQUIRED_ALERT_RECIPIENT }}
      MANAGED_TELEMETRY_WORKSPACE_NAME: ${{ vars.MANAGED_TELEMETRY_WORKSPACE_NAME }}
      MANAGED_TELEMETRY_APPLICATION_INSIGHTS_NAME: ${{ vars.MANAGED_TELEMETRY_APPLICATION_INSIGHTS_NAME }}
      MANAGED_TELEMETRY_API_IDENTITY_NAME: ${{ vars.MANAGED_TELEMETRY_API_IDENTITY_NAME }}
      MANAGED_TELEMETRY_API_IDENTITY_RESOURCE_GROUP: ${{ vars.MANAGED_TELEMETRY_API_IDENTITY_RESOURCE_GROUP }}
      MANAGED_LIFECYCLE_AZURE_MONITOR_ENABLED: ${{ vars.MANAGED_LIFECYCLE_AZURE_MONITOR_ENABLED }}
      STAGING_BILLING_LIFECYCLE_LEVER_ENABLED: ${{ vars.STAGING_BILLING_LIFECYCLE_LEVER_ENABLED }}
      STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS: ${{ vars.STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS }}
      STAGING_RECOVERY_LIFECYCLE_LEVER_ENABLED: ${{ vars.STAGING_RECOVERY_LIFECYCLE_LEVER_ENABLED }}
      STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS: ${{ vars.STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS }}
      STAGING_SMOKE_OWNER_ORGANIZATION_ID: ${{ vars.STAGING_SMOKE_OWNER_ORGANIZATION_ID }}
      STAGING_SMOKE_OWNER_INSTANCE_ID: ${{ vars.STAGING_SMOKE_OWNER_INSTANCE_ID }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      EXPECTED_CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
      TELEMETRY_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.telemetry_action || 'what-if' }}
      CONFIRM_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_environment || '' }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        if: ${{ env.DEPLOY_MODE != 'telemetry' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        if: ${{ env.DEPLOY_MODE != 'telemetry' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Hosting/ElsaControl.Console/package-lock.json

      - name: Check deployment configuration
        id: deployment-config
        env:
          ADMIN_API_KEY: ${{ env.DEPLOY_MODE == 'infra' && secrets.ADMIN_API_KEY || '' }}
          BUILDER_CLIENT_API_KEY: ${{ env.DEPLOY_MODE == 'infra' && secrets.BUILDER_CLIENT_API_KEY || '' }}
          CONTROL_ENTRA_CLIENT_SECRET: ${{ env.DEPLOY_MODE == 'infra' && secrets.CONTROL_ENTRA_CLIENT_SECRET || '' }}
          STRIPE_TEST_SECRET_KEY: ${{ env.TARGET_ENVIRONMENT == 'test' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && secrets.STRIPE_TEST_SECRET_KEY || '' }}
          STRIPE_TEST_WEBHOOK_SIGNING_SECRET: ${{ env.TARGET_ENVIRONMENT == 'test' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && secrets.STRIPE_TEST_WEBHOOK_SIGNING_SECRET || '' }}
          ELSA_CLOUD_STAGING_ORIGIN: ${{ env.TARGET_ENVIRONMENT == 'test' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && vars.ELSA_CLOUD_STAGING_ORIGIN || '' }}
          STRIPE_HOSTED_PRICE_ID: ${{ env.TARGET_ENVIRONMENT == 'test' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && vars.STRIPE_HOSTED_PRICE_ID || '' }}
          STRIPE_PRODUCTION_PRICE_ID: ${{ env.TARGET_ENVIRONMENT == 'production' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && vars.STRIPE_PRODUCTION_PRICE_ID || '' }}
          CONTROL_PRODUCTION_WEBHOOK_URL: ${{ env.TARGET_ENVIRONMENT == 'production' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && vars.CONTROL_PRODUCTION_WEBHOOK_URL || '' }}
          AZURE_EXPECTED_PRODUCTION_PORTAL_RETURN_URL: ${{ env.TARGET_ENVIRONMENT == 'production' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && vars.AZURE_EXPECTED_PRODUCTION_PORTAL_RETURN_URL || '' }}
          AZURE_EXPECTED_PRODUCTION_CHECKOUT_SUCCESS_URL: ${{ env.TARGET_ENVIRONMENT == 'production' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && vars.AZURE_EXPECTED_PRODUCTION_CHECKOUT_SUCCESS_URL || '' }}
          AZURE_EXPECTED_PRODUCTION_CHECKOUT_CANCEL_URL: ${{ env.TARGET_ENVIRONMENT == 'production' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && vars.AZURE_EXPECTED_PRODUCTION_CHECKOUT_CANCEL_URL || '' }}
          AZURE_EXPECTED_PRODUCTION_CLOUD_PORTAL_RETURN_URL: ${{ env.TARGET_ENVIRONMENT == 'production' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' && vars.AZURE_EXPECTED_PRODUCTION_CLOUD_PORTAL_RETURN_URL || '' }}
        shell: bash
        run: |
          set -euo pipefail

          case "$DEPLOY_MODE" in
            app|infra|telemetry|build|promote) ;;
            *)
              echo "::error::Unsupported deployment mode; refusing to continue."
              exit 1
              ;;
          esac

          if [ -n "${CLOUD_ACCOUNT_ISSUER:-}" ]; then
            if [[ ! "${CLOUD_ACCOUNT_ISSUER:-}" =~ ^https://[a-z0-9]{20}\.supabase\.co/auth/v1$ ]]; then
              echo "::error::The Cloud account issuer must be an exact Supabase Auth issuer URL."
              exit 1
            fi
            if [ "$CLOUD_ACCOUNT_ISSUER" != "${EXPECTED_CLOUD_ACCOUNT_ISSUER:-}" ]; then
              echo "::error::The Cloud account issuer must match the approved environment issuer."
              exit 1
            fi
          fi

          pairing_guid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          pairing_allowlist_raw="${EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS:-}"
          pairing_allowlist_count=0
          pairing_normalized=""
          if [ -n "$pairing_allowlist_raw" ]; then
            if [ "$TARGET_ENVIRONMENT" != "test" ]; then
              echo "::error::EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS must be unset for ${TARGET_ENVIRONMENT}; production ships an empty pairing allowlist."
              exit 1
            fi
            if [[ "$pairing_allowlist_raw" =~ (^|,)[[:space:]]*(,|$) ]]; then
              echo "::error::EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS contains an empty organization id."
              exit 1
            fi
            IFS=',' read -r -a pairing_entries <<< "$pairing_allowlist_raw"
            for entry in "${pairing_entries[@]}"; do
              trimmed="${entry#"${entry%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -z "$trimmed" ]; then
                echo "::error::EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS contains an empty organization id."
                exit 1
              fi
              if [[ ! "$trimmed" =~ $pairing_guid_pattern ]] || [ "$trimmed" = "00000000-0000-0000-0000-000000000000" ]; then
                echo "::error::EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS contains an entry that is not a GUID organization id."
                exit 1
              fi
              if [ -n "$pairing_normalized" ]; then
                pairing_normalized+=","
              fi
              pairing_normalized+="$trimmed"
              pairing_allowlist_count=$((pairing_allowlist_count + 1))
            done
          fi
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            {
              printf 'pairing_allowlist_count=%s\n' "$pairing_allowlist_count"
              printf 'pairing_allowlist=%s\n' "$pairing_normalized"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${GITHUB_ENV:-}" ]; then
            printf 'EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS=%s\n' "$pairing_normalized" >> "$GITHUB_ENV"
          fi

          lever_enabled_raw="${STAGING_BILLING_LIFECYCLE_LEVER_ENABLED:-}"
          lever_allowlist_raw="${STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS:-}"
          lever_allowlist_count=0
          lever_normalized=""
          lever_enabled=""
          if [ -n "$lever_enabled_raw" ] || [ -n "$lever_allowlist_raw" ]; then
            if [ "$TARGET_ENVIRONMENT" != "test" ]; then
              echo "::error::STAGING_BILLING_LIFECYCLE_LEVER_ENABLED and STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS must be unset for ${TARGET_ENVIRONMENT}; production ships the lever off."
              exit 1
            fi
          fi
          if [ -n "$lever_enabled_raw" ]; then
            case "${lever_enabled_raw,,}" in
              true) lever_enabled=true ;;
              false) lever_enabled="" ;;
              *)
                echo "::error::STAGING_BILLING_LIFECYCLE_LEVER_ENABLED must be true or false."
                exit 1
                ;;
            esac
          fi
          if [ -n "$lever_allowlist_raw" ]; then
            if [[ "$lever_allowlist_raw" =~ (^|,)[[:space:]]*(,|$) ]]; then
              echo "::error::STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS contains an empty organization id."
              exit 1
            fi
            IFS=',' read -r -a lever_entries <<< "$lever_allowlist_raw"
            for entry in "${lever_entries[@]}"; do
              trimmed="${entry#"${entry%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -z "$trimmed" ]; then
                echo "::error::STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS contains an empty organization id."
                exit 1
              fi
              if [[ ! "$trimmed" =~ $pairing_guid_pattern ]] || [ "$trimmed" = "00000000-0000-0000-0000-000000000000" ]; then
                echo "::error::STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS contains an entry that is not a GUID organization id."
                exit 1
              fi
              if [ -n "$lever_normalized" ]; then
                lever_normalized+=","
              fi
              lever_normalized+="$trimmed"
              lever_allowlist_count=$((lever_allowlist_count + 1))
            done
          fi
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            {
              printf 'staging_billing_lever_enabled=%s\n' "$lever_enabled"
              printf 'staging_billing_lever_allowlist_count=%s\n' "$lever_allowlist_count"
              printf 'staging_billing_lever_allowlist=%s\n' "$lever_normalized"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${GITHUB_ENV:-}" ]; then
            printf 'STAGING_BILLING_LIFECYCLE_LEVER_ENABLED=%s\n' "$lever_enabled" >> "$GITHUB_ENV"
            printf 'STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS=%s\n' "$lever_normalized" >> "$GITHUB_ENV"
          fi

          smoke_owner_org_id="${STAGING_SMOKE_OWNER_ORGANIZATION_ID:-}"
          if [ "$TARGET_ENVIRONMENT" = "test" ] && { [ "$pairing_allowlist_count" -gt 0 ] || [ "$lever_allowlist_count" -gt 0 ]; }; then
            if [ -z "$smoke_owner_org_id" ]; then
              echo "::error::STAGING_SMOKE_OWNER_ORGANIZATION_ID must be set on the test environment so the pairing and staging billing lifecycle lever allowlists can be checked against the Hosted smoke owner organization."
              exit 1
            fi
            if [[ ! "$smoke_owner_org_id" =~ $pairing_guid_pattern ]] || [ "$smoke_owner_org_id" = "00000000-0000-0000-0000-000000000000" ]; then
              echo "::error::STAGING_SMOKE_OWNER_ORGANIZATION_ID must be a GUID organization id."
              exit 1
            fi
            if [[ ",${pairing_normalized,,}," == *",${smoke_owner_org_id,,},"* ]]; then
              echo "::error::EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS must not include the staging Hosted smoke owner organization."
              exit 1
            fi
            if [[ ",${lever_normalized,,}," == *",${smoke_owner_org_id,,},"* ]]; then
              echo "::error::STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS must not include the staging Hosted smoke owner organization."
              exit 1
            fi
          fi
          recovery_enabled_raw="${STAGING_RECOVERY_LIFECYCLE_LEVER_ENABLED:-}"
          recovery_allowlist_raw="${STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS:-}"
          recovery_allowlist_count=0
          recovery_normalized=""
          recovery_enabled=""
          if [ -n "$recovery_enabled_raw" ] || [ -n "$recovery_allowlist_raw" ] || [ -n "${STAGING_SMOKE_OWNER_INSTANCE_ID:-}" ]; then
            if [ "$TARGET_ENVIRONMENT" != "test" ]; then
              echo "::error::STAGING_RECOVERY_LIFECYCLE_LEVER_ENABLED, STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS, and STAGING_SMOKE_OWNER_INSTANCE_ID must be unset for ${TARGET_ENVIRONMENT}; production ships the lever off."
              exit 1
            fi
          fi
          if [ -n "$recovery_enabled_raw" ]; then
            case "${recovery_enabled_raw,,}" in
              true) recovery_enabled=true ;;
              false) recovery_enabled="" ;;
              *)
                echo "::error::STAGING_RECOVERY_LIFECYCLE_LEVER_ENABLED must be true or false."
                exit 1
                ;;
            esac
          fi
          if [ -n "$recovery_allowlist_raw" ]; then
            if [[ "$recovery_allowlist_raw" =~ (^|,)[[:space:]]*(,|$) ]]; then
              echo "::error::STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS contains an empty instance id."
              exit 1
            fi
            IFS=',' read -r -a recovery_entries <<< "$recovery_allowlist_raw"
            for entry in "${recovery_entries[@]}"; do
              trimmed="${entry#"${entry%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -z "$trimmed" ]; then
                echo "::error::STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS contains an empty instance id."
                exit 1
              fi
              if [[ ! "$trimmed" =~ $pairing_guid_pattern ]] || [ "$trimmed" = "00000000-0000-0000-0000-000000000000" ]; then
                echo "::error::STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS contains an entry that is not a GUID instance id."
                exit 1
              fi
              if [ -n "$recovery_normalized" ]; then
                recovery_normalized+=","
              fi
              recovery_normalized+="$trimmed"
              recovery_allowlist_count=$((recovery_allowlist_count + 1))
            done
          fi
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            {
              printf 'staging_recovery_lever_enabled=%s\n' "$recovery_enabled"
              printf 'staging_recovery_lever_allowlist_count=%s\n' "$recovery_allowlist_count"
              printf 'staging_recovery_lever_allowlist=%s\n' "$recovery_normalized"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${GITHUB_ENV:-}" ]; then
            printf 'STAGING_RECOVERY_LIFECYCLE_LEVER_ENABLED=%s\n' "$recovery_enabled" >> "$GITHUB_ENV"
            printf 'STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS=%s\n' "$recovery_normalized" >> "$GITHUB_ENV"
          fi

          smoke_owner_instance_id="${STAGING_SMOKE_OWNER_INSTANCE_ID:-}"
          if [ "$TARGET_ENVIRONMENT" = "test" ] && [ "$recovery_allowlist_count" -gt 0 ]; then
            if [ -z "$smoke_owner_instance_id" ]; then
              echo "::error::STAGING_SMOKE_OWNER_INSTANCE_ID must be set on the test environment so the staging recovery lifecycle lever allowlist can be checked against the Hosted smoke owner instance."
              exit 1
            fi
            if [[ ! "$smoke_owner_instance_id" =~ $pairing_guid_pattern ]] || [ "$smoke_owner_instance_id" = "00000000-0000-0000-0000-000000000000" ]; then
              echo "::error::STAGING_SMOKE_OWNER_INSTANCE_ID must be a GUID instance id."
              exit 1
            fi
            if [[ ",${recovery_normalized,,}," == *",${smoke_owner_instance_id,,},"* ]]; then
              echo "::error::STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS must not include the staging Hosted smoke owner instance."
              exit 1
            fi
          fi

          echo "External-engine pairing allowlist: ${pairing_allowlist_count} organization id(s)."
          echo "Staging billing lifecycle lever: enabled=${lever_enabled}; allowlist=${lever_allowlist_count} organization id(s)."
          echo "Staging recovery lifecycle lever: enabled=${recovery_enabled}; allowlist=${recovery_allowlist_count} instance id(s)."

          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
          )

          if [ "$DEPLOY_MODE" != "telemetry" ]; then
            required+=(AZURE_CONTAINER_REGISTRY_ENDPOINT)
          fi

          if [ "$DEPLOY_MODE" != "build" ] && [ "$DEPLOY_MODE" != "telemetry" ]; then
            required+=(
              AZURE_ENV_NAME
              AZURE_LOCATION
              AZURE_RESOURCE_GROUP
              AZURE_WEBAPP_NAME
            )
          fi

          if [ "$DEPLOY_MODE" = "telemetry" ]; then
            if [ "$TARGET_ENVIRONMENT" != "test" ] && [ "$TARGET_ENVIRONMENT" != "production" ]; then
              echo "::error::Telemetry-only deploy is limited to test or production; refusing to continue."
              exit 1
            fi
            telemetry_action="${TELEMETRY_ACTION:-what-if}"
            case "$telemetry_action" in
              what-if|create) ;;
              *)
                echo "::error::Unsupported telemetry action; refusing to continue."
                exit 1
                ;;
            esac
            if [ "$TARGET_ENVIRONMENT" = "production" ] && [ "${CONFIRM_ENVIRONMENT:-}" != "production" ]; then
              echo "::error::Telemetry mode refuses the default production target unless confirm_environment is production."
              exit 1
            fi
            if [ "$telemetry_action" = "create" ] && [ "${CONFIRM_ENVIRONMENT:-}" != "$TARGET_ENVIRONMENT" ]; then
              echo "::error::Telemetry create requires confirm_environment to equal the target environment name."
              exit 1
            fi
            required+=(
              AZURE_LOCATION
              AZURE_RESOURCE_GROUP
              MANAGED_TELEMETRY_WORKSPACE_NAME
              MANAGED_TELEMETRY_APPLICATION_INSIGHTS_NAME
              MANAGED_TELEMETRY_API_IDENTITY_NAME
              MANAGED_TELEMETRY_API_IDENTITY_RESOURCE_GROUP
            )
            if [ "$TARGET_ENVIRONMENT" = "test" ]; then
              required+=(
                STAGING_RECOVERY_REQUIRED_ALERT_RECIPIENT
                PRODUCTION_RECOVERY_REQUIRED_ALERT_RECIPIENT
              )
            else
              required+=(PRODUCTION_RECOVERY_REQUIRED_ALERT_RECIPIENT)
            fi
            if [ "$TARGET_ENVIRONMENT" = "test" ] &&
               [ -n "${STAGING_RECOVERY_REQUIRED_ALERT_RECIPIENT:-}" ] &&
               [ -n "${PRODUCTION_RECOVERY_REQUIRED_ALERT_RECIPIENT:-}" ] &&
               [ "$STAGING_RECOVERY_REQUIRED_ALERT_RECIPIENT" = "$PRODUCTION_RECOVERY_REQUIRED_ALERT_RECIPIENT" ]; then
              echo "::error::Staging RecoveryRequired alerts must not use the production mailbox."
              exit 1
            fi
          fi

          if [ "$DEPLOY_MODE" = "infra" ]; then
            required+=(
              ADMIN_API_KEY
              BUILDER_CLIENT_API_KEY
              CONTROL_ENTRA_CLIENT_ID
              CONTROL_ENTRA_CLIENT_SECRET
              CONTROL_ENTRA_TENANT_ID
            )
            if [ "$TARGET_ENVIRONMENT" = "test" ]; then
              required+=(AZURE_PROVISIONER_IDENTITY_ID)
            fi
          fi

          if [ "$TARGET_ENVIRONMENT" = "test" ] && [ "$DEPLOY_MODE" != "build" ] && [ "$DEPLOY_MODE" != "telemetry" ]; then
            required+=(
              ELSA_CLOUD_STAGING_ORIGIN
              STRIPE_HOSTED_PRICE_ID
              STRIPE_TEST_SECRET_KEY
              STRIPE_TEST_WEBHOOK_SIGNING_SECRET
            )
            if [[ "${STRIPE_TEST_SECRET_KEY:-}" != sk_test_* ]] ||
               [[ "${STRIPE_TEST_WEBHOOK_SIGNING_SECRET:-}" != whsec_* ]]; then
              echo "::error::The test environment Stripe credentials have an unexpected shape."
              exit 1
            fi
          fi

          billing_expected_mode=""
          # Development is not a billing target. Do not set ExpectedMode there:
          # the workflow does not require Stripe secrets for development, and
          # StripeBillingConfigurationValidator only demands ExpectedMode when
          # billing is enabled. Enabling development billing is unsupported.
          if [ "$TARGET_ENVIRONMENT" = "test" ] && [ "$DEPLOY_MODE" != "build" ] && [ "$DEPLOY_MODE" != "telemetry" ]; then
            billing_expected_mode="test"
          elif [ "$TARGET_ENVIRONMENT" = "production" ] && [ "$DEPLOY_MODE" != "build" ] && [ "$DEPLOY_MODE" != "telemetry" ]; then
            billing_expected_mode="live"
            required+=(
              STRIPE_PRODUCTION_PRICE_ID
              CONTROL_PRODUCTION_WEBHOOK_URL
              AZURE_EXPECTED_PRODUCTION_PORTAL_RETURN_URL
              AZURE_EXPECTED_PRODUCTION_CHECKOUT_SUCCESS_URL
              AZURE_EXPECTED_PRODUCTION_CHECKOUT_CANCEL_URL
              AZURE_EXPECTED_PRODUCTION_CLOUD_PORTAL_RETURN_URL
            )
          fi

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            printf 'billing_expected_mode=%s\n' "$billing_expected_mode" >> "$GITHUB_OUTPUT"
          fi

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            if [ "$TARGET_ENVIRONMENT" = "production" ] && [ "$DEPLOY_MODE" != "build" ] && [ "$DEPLOY_MODE" != "telemetry" ]; then
              if ! python3 - <<'PY'
          from scripts.production_stripe_reconcile import ProductionAuditConfig, ReconciliationError

          try:
              ProductionAuditConfig.from_environment()
          except (ReconciliationError, ValueError):
              raise SystemExit(1)
          PY
              then
                echo "::error::Production Stripe audit configuration is invalid; refusing to mutate Azure."
                exit 1
              fi
            fi
            echo "deploy_configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing_names="$(IFS=', '; echo "${missing[*]}")"
          echo "deploy_configured=false" >> "$GITHUB_OUTPUT"
          echo "missing_names=$missing_names" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Deployment configuration is incomplete. Missing: $missing_names"
            exit 1
          fi

          echo "::notice::Deployment skipped because configuration is incomplete. Missing: $missing_names"

      - name: Require main ref for Azure mutation
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Azure deployment and candidate publication are permitted only from the main branch; refusing to continue."
            exit 1
          fi

      - name: Audit staging Stripe resources before deployment
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.TARGET_ENVIRONMENT == 'test' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SIGNING_SECRET }}
          STRIPE_HOSTED_PRICE_ID: ${{ vars.STRIPE_HOSTED_PRICE_ID }}
          CONTROL_STAGING_WEBHOOK_URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/billing/webhooks/stripe
          CLOUD_PORTAL_RETURN_URL: ${{ vars.ELSA_CLOUD_STAGING_ORIGIN }}/dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging_stripe_reconcile.py --audit-stripe-only

      - name: Restore
        if: ${{ env.DEPLOY_MODE != 'telemetry' }}
        run: dotnet restore ElsaControl.sln

      - name: Build AppHost
        if: ${{ env.DEPLOY_MODE != 'telemetry' }}
        run: dotnet build src/Hosting/ElsaControl.AppHost/ElsaControl.AppHost.csproj --configuration Release --no-restore

      - name: Test API
        if: ${{ env.DEPLOY_MODE != 'telemetry' }}
        run: dotnet test tests/Hosting/ElsaControl.Api.Tests/ElsaControl.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Build and test console
        if: ${{ env.DEPLOY_MODE != 'telemetry' }}
        working-directory: src/Hosting/ElsaControl.Console
        run: |
          npm ci
          npm test
          npm run build

      - name: Log in Azure CLI
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check immutable promotion inputs
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'promote' }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::A successful candidate run identity is required for immutable promotion."
            exit 1
          }
          [[ "$EXPECTED_CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::An expected immutable candidate digest is required for promotion."
            exit 1
          }
          [[ "$AZURE_CONTAINER_REGISTRY_ENDPOINT" =~ ^[a-z0-9][a-z0-9.-]*\.azurecr\.io$ ]] || {
            echo "::error::The configured container registry endpoint has an unexpected format; refusing promotion."
            exit 1
          }

      - name: Download trusted API candidate descriptor
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'promote' }}
        uses: actions/download-artifact@v4
        with:
          name: elsa-control-api-candidate
          path: ${{ runner.temp }}/elsa-control-api-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Validate trusted API candidate
        id: candidate-authority
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'promote' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          scripts/validate-azure-api-candidate.sh \
            "$RUNNER_TEMP/elsa-control-api-candidate/candidate.json" \
            "$CANDIDATE_RUN_ID" \
            "$EXPECTED_CANDIDATE_DIGEST" \
            "$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_OUTPUT"

      - name: Verify candidate image in ACR
        if: ${{ success() && steps.candidate-authority.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"
          if ! candidate_digest="$(az acr manifest show-metadata \
            --registry "$acr_name" \
            --name "elsa-control/api@$EXPECTED_CANDIDATE_DIGEST" \
            --query digest \
            --output tsv \
            --only-show-errors 2>/dev/null)"; then
            echo "::error::The validated candidate image is not present in the configured registry; refusing promotion."
            exit 1
          fi
          if [ "$candidate_digest" != "$EXPECTED_CANDIDATE_DIGEST" ]; then
            echo "::error::The configured registry returned a different candidate digest; refusing promotion."
            exit 1
          fi

      - name: Build and publish API candidate
        id: candidate-image
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'build' }}
        shell: bash
        run: |
          set -euo pipefail

          command -v jq >/dev/null 2>&1 || {
            echo "::error::JSON tooling is unavailable; refusing to emit a candidate descriptor."
            exit 1
          }
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The build source identity has an unexpected format; refusing to publish a candidate."
            exit 1
          fi
          if [[ ! "$AZURE_CONTAINER_REGISTRY_ENDPOINT" =~ ^[a-z0-9][a-z0-9.-]*\.azurecr\.io$ ]]; then
            echo "::error::The configured container registry endpoint has an unexpected format; refusing to publish a candidate."
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::The build run identity has an unexpected format; refusing to publish a candidate."
            exit 1
          fi

          acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          image="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api:$candidate_tag"
          image_repository="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api"
          candidate_descriptor_directory="$RUNNER_TEMP/elsa-control-api-candidate"
          candidate_descriptor="$candidate_descriptor_directory/candidate.json"
          mkdir -p "$candidate_descriptor_directory"

          az acr login --name "$acr_name" --only-show-errors
          docker build \
            --build-arg ELSA_CONTROL_IMAGE_ID="$GITHUB_SHA" \
            --file src/Hosting/ElsaControl.Api/Dockerfile \
            --tag "$image" \
            .
          docker push "$image"

          digest="$(az acr manifest show-metadata \
            --registry "$acr_name" \
            --name "elsa-control/api:$candidate_tag" \
            --query digest \
            --output tsv \
            --only-show-errors)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The published candidate did not resolve to an immutable digest; refusing to emit a candidate descriptor."
            exit 1
          fi

          jq -n \
            --arg repository "$image_repository" \
            --arg digest "$digest" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg build_run_id "$GITHUB_RUN_ID" \
            --arg build_run_number "$GITHUB_RUN_NUMBER" \
            '{artifactSchemaVersion: 1, repository: $repository, digest: $digest,
              sourceRepository: $source_repository, sourceSha: $source_sha,
              buildRunId: $build_run_id, buildRunNumber: $build_run_number}' \
            > "$candidate_descriptor"
          printf 'descriptor_path=%s\n' "$candidate_descriptor" >> "$GITHUB_OUTPUT"

      - name: Upload API candidate descriptor
        if: ${{ success() && steps.candidate-image.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: elsa-control-api-candidate
          path: ${{ steps.candidate-image.outputs.descriptor_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Capture current API deployment
        id: current-deployment
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' }}
        shell: bash
        run: |
          set -euo pipefail

          webapp_probe_file="$(mktemp)"
          trap 'rm -f "$webapp_probe_file"' EXIT
          if ! current_webapp_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query name \
            --output tsv \
            --only-show-errors 2>"$webapp_probe_file")"; then
            if [ "$DEPLOY_MODE" = "infra" ] && grep -Eq 'Resource(NotFound|GroupNotFound)|was not found' "$webapp_probe_file"; then
              echo "capture_succeeded=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping previous deployment capture because the Web App does not exist yet; infra deployment will create it."
              exit 0
            fi

            echo "::error::Could not determine whether the current Web App exists; refusing an unprotected deployment."
            exit 1
          fi
          if [ -z "$current_webapp_name" ]; then
            echo "::error::Azure returned no Web App name; refusing an unprotected deployment."
            exit 1
          fi

          if ! linux_fx_version="$(az webapp config show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query linuxFxVersion \
            --output tsv)"; then
            echo "::error::Could not capture the current Linux runtime image; refusing an unprotected deployment."
            exit 1
          fi
          if [ -z "$linux_fx_version" ]; then
            echo "::error::Could not capture the current Linux runtime image; refusing an unprotected deployment."
            exit 1
          fi

          image_reference_pattern='([[:alnum:]][[:alnum:].-]*)(:[[:digit:]]+)?/[[:alnum:]][[:alnum:]._/-]*(:[[:alnum:]][[:alnum:]._+-]*)?(@sha256:[[:xdigit:]]{64})?'
          deployment_mode=""
          sitecontainer_image=""
          if [[ "$linux_fx_version" =~ ^DOCKER\|$image_reference_pattern$ ]]; then
            deployment_mode=classic
          elif [ "$linux_fx_version" = "SITECONTAINERS" ]; then
            deployment_mode=sitecontainers
            if ! sitecontainer_image="$(az webapp sitecontainers show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --container-name main \
              --query image \
              --output tsv)"; then
              echo "::error::Could not capture the current main sitecontainer image; refusing an unprotected deployment."
              exit 1
            fi
            if [[ ! "$sitecontainer_image" =~ ^$image_reference_pattern$ ]]; then
              echo "::error::The captured main sitecontainer image has an unexpected or unsafe format."
              exit 1
            fi
          else
            echo "::error::The captured Linux runtime has an unsupported format; expected DOCKER|... or SITECONTAINERS."
            exit 1
          fi

          rollback_linux_fx_version="$linux_fx_version"
          rollback_sitecontainer_image="$sitecontainer_image"
          if [ "$DEPLOY_MODE" = "promote" ]; then
            if [[ ! "$AZURE_CONTAINER_REGISTRY_ENDPOINT" =~ ^[a-z0-9][a-z0-9.-]*\.azurecr\.io$ ]]; then
              echo "::error::The configured container registry endpoint has an unexpected format; refusing promotion."
              exit 1
            fi

            expected_image_repository="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api"
            acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"
            if [ "$deployment_mode" = "classic" ]; then
              current_image="${linux_fx_version#DOCKER|}"
            else
              current_image="$sitecontainer_image"
            fi

            case "$current_image" in
              "$expected_image_repository"@*)
                previous_digest="${current_image#"$expected_image_repository"@}"
                ;;
              "$expected_image_repository":*)
                previous_tag="${current_image#"$expected_image_repository":}"
                if [[ ! "$previous_tag" =~ ^[[:alnum:]][[:alnum:]._+-]{0,127}$ ]]; then
                  echo "::error::The captured previous image tag has an unexpected format; refusing promotion."
                  exit 1
                fi
                if ! previous_digest="$(az acr manifest show-metadata \
                  --registry "$acr_name" \
                  --name "elsa-control/api:$previous_tag" \
                  --query digest \
                  --output tsv \
                  --only-show-errors 2>/dev/null)"; then
                  echo "::error::The captured previous image could not be resolved to an immutable digest; refusing promotion."
                  exit 1
                fi
                ;;
              *)
                echo "::error::The captured previous image is not owned by the configured API repository; refusing promotion."
                exit 1
                ;;
            esac

            if [[ ! "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The captured previous image did not resolve to an immutable digest; refusing promotion."
              exit 1
            fi
            if ! verified_previous_digest="$(az acr manifest show-metadata \
              --registry "$acr_name" \
              --name "elsa-control/api@$previous_digest" \
              --query digest \
              --output tsv \
              --only-show-errors 2>/dev/null)"; then
              echo "::error::The captured previous image digest could not be verified in the configured repository; refusing promotion."
              exit 1
            fi
            if [ "$verified_previous_digest" != "$previous_digest" ]; then
              echo "::error::The captured previous image digest did not match the configured repository; refusing promotion."
              exit 1
            fi

            rollback_image="$expected_image_repository@$previous_digest"
            if [ "$deployment_mode" = "classic" ]; then
              rollback_linux_fx_version="DOCKER|$rollback_image"
            else
              rollback_sitecontainer_image="$rollback_image"
            fi

            image_id_override_count="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query "[?name=='ELSA_CONTROL_IMAGE_ID'] | length(@)" \
              --output tsv \
              --only-show-errors)"
            if [ "$image_id_override_count" != "0" ]; then
              echo "::error::The Web App has a runtime image identity override; refusing promotion."
              exit 1
            fi
          fi

          application_build_number="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query "[?name=='Application__BuildNumber'] | [0].value" \
            --output tsv)"
          if [ "$application_build_number" = "None" ]; then
            application_build_number=""
          fi

          safe_identifier_pattern='^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$'
          if [ -n "$application_build_number" ]; then
            if [[ ! "$application_build_number" =~ $safe_identifier_pattern ]]; then
              echo "::error::The captured Application__BuildNumber has an unexpected or unsafe format."
              exit 1
            fi

            echo "application_build_number_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "application_build_number_present=false" >> "$GITHUB_OUTPUT"
          fi

          if ! default_host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"; then
            echo "::error::Could not resolve the current API host for deployment identity capture; refusing an unprotected deployment."
            exit 1
          fi
          if [ -z "$default_host_name" ]; then
            echo "::error::Azure returned no current API host for deployment identity capture; refusing an unprotected deployment."
            exit 1
          fi
          health_response_file="$(mktemp)"
          trap 'rm -f "$webapp_probe_file" "$health_response_file"' EXIT
          health_url="https://$default_host_name/health"
          previous_health_build_number=""
          previous_health_image_id=""
          if ! http_status="$(curl --silent --show-error --output "$health_response_file" --write-out '%{http_code}' --max-time 10 "$health_url")"; then
            http_status=000
          fi
          if [ "$http_status" = "200" ] && jq -e '.status == "ok"' "$health_response_file" >/dev/null 2>&1; then
            if jq -e 'type == "object"' "$health_response_file" >/dev/null 2>&1; then
              previous_health_build_number="$(jq -r '.buildNumber // empty' "$health_response_file")"
              previous_health_image_id="$(jq -r '.imageId // empty' "$health_response_file")"
              if [ "$previous_health_build_number" = "unknown" ]; then
                previous_health_build_number=""
              fi
              if [ "$previous_health_image_id" = "unknown" ]; then
                previous_health_image_id=""
              fi
              for identifier in previous_health_build_number previous_health_image_id; do
                value="${!identifier}"
                if [ -n "$value" ] && [[ ! "$value" =~ $safe_identifier_pattern ]]; then
                  echo "::error::The current API health response contains an unexpected or unsafe $identifier; refusing an unprotected deployment."
                  exit 1
                fi
              done
              echo "Captured safe current API build/image identity for rollback verification."
            else
              echo "::notice::The current API health response had no object identity fields; retaining Azure image/build metadata and using rollback compatibility verification."
            fi
          else
            previous_health_build_number=""
            previous_health_image_id=""
            echo "::notice::Current API health was unavailable or not healthy at $health_url (HTTP ${http_status:-000}); retaining Azure image/build metadata and using rollback compatibility verification."
          fi
          echo "deployment_mode=$deployment_mode" >> "$GITHUB_OUTPUT"
          echo "linux_fx_version=$rollback_linux_fx_version" >> "$GITHUB_OUTPUT"
          if [ -n "$rollback_sitecontainer_image" ]; then
            echo "sitecontainer_image=$rollback_sitecontainer_image" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$application_build_number" ]; then
            echo "application_build_number=$application_build_number" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$previous_health_build_number" ]; then
            echo "previous_health_build_number=$previous_health_build_number" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$previous_health_image_id" ]; then
            echo "previous_health_image_id=$previous_health_image_id" >> "$GITHUB_OUTPUT"
          fi
          echo "capture_succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Capture production Stripe billing settings before replacement
        id: production-billing-capture
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.TARGET_ENVIRONMENT == 'production' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' }}
        env:
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
          PRODUCTION_BILLING_CAPTURE_PATH: ${{ runner.temp }}/elsa-control-production-billing.json
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/production_stripe_reconcile.py --capture "$PRODUCTION_BILLING_CAPTURE_PATH"

      - name: Deploy API app
        id: deploy-api
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' }}
        env:
          VALIDATED_CANDIDATE_IMAGE: ${{ steps.candidate-authority.outputs.candidate_image }}
          VALIDATED_CANDIDATE_BUILD_NUMBER: ${{ steps.candidate-authority.outputs.candidate_build_number }}
          ADMIN_API_KEY: ${{ env.DEPLOY_MODE == 'infra' && secrets.ADMIN_API_KEY || '' }}
          BUILDER_CLIENT_API_KEY: ${{ env.DEPLOY_MODE == 'infra' && secrets.BUILDER_CLIENT_API_KEY || '' }}
          CONTROL_ENTRA_CLIENT_SECRET: ${{ env.DEPLOY_MODE == 'infra' && secrets.CONTROL_ENTRA_CLIENT_SECRET || '' }}
          APPLICATION_BUILD_NUMBER: ${{ github.run_number }}
          EXTERNAL_ENGINE_PAIRING_ALLOWED_ORG_IDS: ${{ steps.deployment-config.outputs.pairing_allowlist }}
          STAGING_BILLING_LIFECYCLE_LEVER_ENABLED: ${{ steps.deployment-config.outputs.staging_billing_lever_enabled }}
          STAGING_BILLING_LIFECYCLE_LEVER_ALLOWED_ORG_IDS: ${{ steps.deployment-config.outputs.staging_billing_lever_allowlist }}
          STAGING_RECOVERY_LIFECYCLE_LEVER_ENABLED: ${{ steps.deployment-config.outputs.staging_recovery_lever_enabled }}
          STAGING_RECOVERY_LIFECYCLE_LEVER_ALLOWED_INSTANCE_IDS: ${{ steps.deployment-config.outputs.staging_recovery_lever_allowlist }}
          STAGING_SMOKE_OWNER_INSTANCE_ID: ${{ vars.STAGING_SMOKE_OWNER_INSTANCE_ID }}
          BILLING_EXPECTED_MODE: ${{ steps.deployment-config.outputs.billing_expected_mode }}
          PRODUCTION_BILLING_CAPTURE_PATH: ${{ runner.temp }}/elsa-control-production-billing.json
        shell: bash
        run: |
          set -euo pipefail

          production_billing_capture_path=""
          if [ "${TARGET_ENVIRONMENT:-}" = "production" ] && [ "$DEPLOY_MODE" != "build" ]; then
            production_billing_capture_path="${PRODUCTION_BILLING_CAPTURE_PATH:-}"
          fi
          pairing_allowlist_prefix='ElsaControl__ExternalEngines__PairingAllowedOrganizationIds__'
          pairing_before_count=""

          write_billing_expected_mode() {
            if [ -z "${BILLING_EXPECTED_MODE:-}" ]; then
              return 0
            fi
            # Capture prior ExpectedMode and billing enablement before any
            # write. Rollback restores that coherent pair for every trigger,
            # including settings later written by staging reconciliation.
            # Fail closed if the non-secret restore set cannot be read.
            # Skip the ExpectedMode write when Azure already has the target.
            # First-enabled (absent or different) still writes before the
            # new image can start. Secret values are never captured here.
            if ! billing_restore_records="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query "[?name=='Billing__Stripe__ExpectedMode' || name=='Billing__Stripe__Enabled' || name=='Billing__Lifecycle__Enabled']" \
              --output json \
              --only-show-errors)"; then
              echo "::error::Could not read billing restore settings; refusing to mutate the Web App."
              exit 1
            fi
            billing_restore_records="$(printf '%s' "$billing_restore_records" | jq -c 'if type == "array" then . elif . == null then [] else [.] end')"
            billing_mode_pattern='^(test|live|staging|production)$'

            # Enablement flags use the same case-insensitive Boolean semantics
            # as scripts/production_stripe_reconcile.py (.strip().lower()).
            # Capture still publishes the exact original string.
            trim_billing_setting() {
              local raw="$1"
              raw="${raw#"${raw%%[![:space:]]*}"}"
              raw="${raw%"${raw##*[![:space:]]}"}"
              printf '%s' "$raw"
            }
            billing_enabled_normalized() {
              local trimmed
              trimmed="$(trim_billing_setting "$1")"
              printf '%s' "${trimmed,,}"
            }
            is_billing_enabled_flag() {
              local normalized
              normalized="$(billing_enabled_normalized "$1")"
              [ "$normalized" = "true" ] || [ "$normalized" = "false" ]
            }

            extract_billing_restore_record() {
              printf '%s' "$billing_restore_records" | jq -c --arg name "$1" \
                '[.[] | select(.name == $name)] | if length == 0 then null else .[0] end'
            }

            inspect_billing_restore_record() {
              local record="$1"
              billing_restore_present="false"
              billing_restore_value=""
              billing_restore_slot="false"
              if [ -n "$record" ] && [ "$record" != "null" ]; then
                # jq -j plus a sentinel keeps trailing CR/LF that
                # command substitution would otherwise strip.
                billing_restore_value="$(printf '%s' "$record" | jq -j '.value // empty'; printf x)"
                billing_restore_value="${billing_restore_value%x}"
                billing_restore_slot="$(printf '%s' "$record" | jq -r 'if .slotSetting == true then "true" else "false" end')"
                billing_restore_present="true"
              fi
            }

            require_billing_restore_format() {
              local setting_name="$1"
              local value_kind="$2"
              local value="$3"
              if [ "$value_kind" = "enabled" ]; then
                if ! is_billing_enabled_flag "$value"; then
                  echo "::error::The captured ${setting_name} has an unexpected or unsafe format."
                  exit 1
                fi
              elif [[ ! "$value" =~ $billing_mode_pattern ]]; then
                echo "::error::The captured ${setting_name} has an unexpected or unsafe format."
                exit 1
              fi
            }

            write_github_output_value() {
              local name="$1"
              local value="$2"
              local delimiter="ELSA_BILLING_CAPTURE_EOF"
              local n=0
              while [[ "$value" == *"$delimiter"* ]]; do
                n=$((n + 1))
                delimiter="ELSA_BILLING_CAPTURE_EOF_${n}"
              done
              {
                printf '%s<<%s\n' "$name" "$delimiter"
                printf '%s' "$value"
                printf '\n%s\n' "$delimiter"
              } >> "$GITHUB_OUTPUT"
            }

            publish_billing_restore_output() {
              local prefix="$1"
              local present="$2"
              local value="$3"
              local slot_setting="$4"
              if [ -n "${GITHUB_OUTPUT:-}" ]; then
                echo "${prefix}_present=$present" >> "$GITHUB_OUTPUT"
                if [ "$present" = "true" ]; then
                  # Delimited records keep leading/trailing CR/LF lossless
                  # and stay valid for the Actions runner parser. A
                  # single-line NAME=VALUE assignment would split.
                  write_github_output_value "$prefix" "$value"
                  echo "${prefix}_slot_setting=$slot_setting" >> "$GITHUB_OUTPUT"
                fi
              fi
            }

            # Validate the full restore set before publishing any capture
            # output so one invalid flag cannot leave a partial prior-state
            # record for rollback.
            billing_expected_mode_record="$(extract_billing_restore_record "Billing__Stripe__ExpectedMode")"
            billing_stripe_enabled_record="$(extract_billing_restore_record "Billing__Stripe__Enabled")"
            billing_lifecycle_enabled_record="$(extract_billing_restore_record "Billing__Lifecycle__Enabled")"

            inspect_billing_restore_record "$billing_expected_mode_record"
            billing_expected_mode_present="$billing_restore_present"
            billing_expected_mode_value="$billing_restore_value"
            billing_expected_mode_slot="$billing_restore_slot"
            if [ "$billing_expected_mode_present" = "true" ]; then
              require_billing_restore_format \
                "Billing__Stripe__ExpectedMode" \
                "mode" \
                "$billing_expected_mode_value"
            fi

            inspect_billing_restore_record "$billing_stripe_enabled_record"
            billing_stripe_enabled_present="$billing_restore_present"
            billing_stripe_enabled_value="$billing_restore_value"
            billing_stripe_enabled_slot="$billing_restore_slot"
            if [ "$billing_stripe_enabled_present" = "true" ]; then
              require_billing_restore_format \
                "Billing__Stripe__Enabled" \
                "enabled" \
                "$billing_stripe_enabled_value"
            fi

            inspect_billing_restore_record "$billing_lifecycle_enabled_record"
            billing_lifecycle_enabled_present="$billing_restore_present"
            billing_lifecycle_enabled_value="$billing_restore_value"
            billing_lifecycle_enabled_slot="$billing_restore_slot"
            if [ "$billing_lifecycle_enabled_present" = "true" ]; then
              require_billing_restore_format \
                "Billing__Lifecycle__Enabled" \
                "enabled" \
                "$billing_lifecycle_enabled_value"
            fi

            publish_billing_restore_output \
              "billing_expected_mode" \
              "$billing_expected_mode_present" \
              "$billing_expected_mode_value" \
              "$billing_expected_mode_slot"
            publish_billing_restore_output \
              "billing_stripe_enabled" \
              "$billing_stripe_enabled_present" \
              "$billing_stripe_enabled_value" \
              "$billing_stripe_enabled_slot"
            publish_billing_restore_output \
              "billing_lifecycle_enabled" \
              "$billing_lifecycle_enabled_present" \
              "$billing_lifecycle_enabled_value" \
              "$billing_lifecycle_enabled_slot"
            current_expected_mode="$billing_expected_mode_value"
            if [ "$current_expected_mode" = "$BILLING_EXPECTED_MODE" ]; then
              return 0
            fi
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings "Billing__Stripe__ExpectedMode=$BILLING_EXPECTED_MODE" \
              --output none
          }

          if [ "$DEPLOY_MODE" = "infra" ]; then
            if pairing_before_count="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query "[?starts_with(name, '${pairing_allowlist_prefix}')] | length(@)" \
              --output tsv \
              --only-show-errors 2>/dev/null)"; then
              :
            else
              pairing_before_count=0
            fi
            pairing_before_count="${pairing_before_count:-0}"
            scripts/deploy-azure-elsa-control.sh \
              --environment "$AZURE_ENV_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --image-tag "$GITHUB_SHA"
          elif [ "$DEPLOY_MODE" = "app" ]; then
            image="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api:${GITHUB_SHA}"
            acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"
            current_deployment_mode="${{ steps.current-deployment.outputs.deployment_mode }}"

            az acr login --name "$acr_name"
            docker build \
              --build-arg ELSA_CONTROL_IMAGE_ID="$GITHUB_SHA" \
              --file src/Hosting/ElsaControl.Api/Dockerfile \
              --tag "$image" \
              .
            docker push "$image"

            # App mode: write ExpectedMode before the image switch so the first
            # billing-enabled start of the new image cannot miss it.
            # StripeBillingConfigurationValidator throws at host start when
            # billing is enabled without ExpectedMode. The helper captures
            # prior ExpectedMode and billing enablement first; rollback
            # restores that coherent pair after any API rollback trigger.
            # The later combined settings write still includes ExpectedMode
            # after a successful switch.
            write_billing_expected_mode

            if [ "$current_deployment_mode" = "sitecontainers" ]; then
              az webapp sitecontainers update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-name main \
                --image "$image" \
                --is-main true \
                --output none
            elif [ "$current_deployment_mode" = "classic" ]; then
              az webapp config container set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-image-name "$image" \
                --container-registry-url "https://$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
                --output none
            else
              echo "::error::The captured deployment mode is unsupported; refusing an unprotected deployment."
              exit 1
            fi
          elif [ "$DEPLOY_MODE" = "promote" ]; then
            image="$VALIDATED_CANDIDATE_IMAGE"
            current_deployment_mode="${{ steps.current-deployment.outputs.deployment_mode }}"
            expected_image_repository="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api"
            if [[ "$image" != "$expected_image_repository"@sha256:* ]]; then
              echo "::error::The candidate image is not the validated immutable repository reference; refusing promotion."
              exit 1
            fi
            candidate_digest="${image#"$expected_image_repository"@}"
            if [[ ! "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The candidate image digest has an unexpected format; refusing promotion."
              exit 1
            fi
            # A promoted image keeps the build number of the run that built and validated it;
            # the promotion run number is not a build identity. Refuse before touching the Web App.
            application_build_number="$VALIDATED_CANDIDATE_BUILD_NUMBER"
            if [[ ! "$application_build_number" =~ ^[1-9][0-9]{0,19}$ ]]; then
              echo "::error::The validated candidate build number is unavailable; refusing promotion."
              exit 1
            fi

            # Promote switches the image; write ExpectedMode first for the
            # same first-start reason as app mode. Prior ExpectedMode and
            # billing enablement are captured for coherent rollback restore.
            # The later combined settings write stays after a successful
            # readback.
            write_billing_expected_mode

            if [ "$current_deployment_mode" = "sitecontainers" ]; then
              az webapp sitecontainers update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-name main \
                --image "$image" \
                --is-main true \
                --output none
            elif [ "$current_deployment_mode" = "classic" ]; then
              az webapp config container set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-image-name "$image" \
                --container-registry-url "https://$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
                --output none
            else
              echo "::error::The captured deployment mode is unsupported; refusing promotion."
              exit 1
            fi

            expected_runtime_reference="$image"
            if [ "$current_deployment_mode" = "classic" ]; then
              expected_runtime_reference="DOCKER|$image"
              if ! configured_runtime_reference="$(az webapp config show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --query linuxFxVersion \
                --output tsv \
                --only-show-errors)"; then
                echo "::error::The promoted Docker runtime could not be read back; refusing promotion acceptance."
                exit 1
              fi
            else
              if ! configured_runtime_reference="$(az webapp sitecontainers show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-name main \
                --query image \
                --output tsv \
                --only-show-errors)"; then
                echo "::error::The promoted main sitecontainer could not be read back; refusing promotion acceptance."
                exit 1
              fi
            fi
            if [ "$configured_runtime_reference" != "$expected_runtime_reference" ]; then
              echo "::error::The promoted runtime did not match the validated immutable image; refusing promotion acceptance."
              exit 1
            fi
          else
            echo "::error::The selected deployment mode cannot mutate the Web App."
            exit 1
          fi

          if [ "$DEPLOY_MODE" != "promote" ]; then
            application_build_number="$GITHUB_RUN_NUMBER"
          fi
          cloud_account_enabled=false
          if [ -n "${CLOUD_ACCOUNT_ISSUER:-}" ]; then
            cloud_account_enabled=true
          fi
          cloud_account_settings=(
            "Authentication__CloudAccount__Enabled=$cloud_account_enabled"
            "Authentication__CloudAccount__Issuer=${CLOUD_ACCOUNT_ISSUER:-}"
            "Authentication__CloudAccount__Audience=authenticated"
          )
          if [ -z "$pairing_before_count" ]; then
            if pairing_before_count="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query "[?starts_with(name, '${pairing_allowlist_prefix}')] | length(@)" \
              --output tsv \
              --only-show-errors 2>/dev/null)"; then
              :
            else
              pairing_before_count=0
            fi
            pairing_before_count="${pairing_before_count:-0}"
          fi
          azure_monitor_settings=()
          if [ "${TARGET_ENVIRONMENT:-}" = "test" ]; then
            azure_monitor_settings+=("ManagedLifecycleTelemetry__AzureMonitor__Environment=staging")
          elif [ "${TARGET_ENVIRONMENT:-}" = "production" ]; then
            azure_monitor_settings+=("ManagedLifecycleTelemetry__AzureMonitor__Environment=production")
          fi
          if [ -n "${MANAGED_LIFECYCLE_AZURE_MONITOR_ENABLED:-}" ]; then
            azure_monitor_settings+=("ManagedLifecycleTelemetry__AzureMonitor__Enabled=$MANAGED_LIFECYCLE_AZURE_MONITOR_ENABLED")
          fi
          billing_mode_settings=()
          if [ -n "${BILLING_EXPECTED_MODE:-}" ]; then
            billing_mode_settings+=("Billing__Stripe__ExpectedMode=$BILLING_EXPECTED_MODE")
          fi
          if [ "$DEPLOY_MODE" = "infra" ]; then
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings Application__BuildNumber="$application_build_number" "${cloud_account_settings[@]}" "${azure_monitor_settings[@]}" "${billing_mode_settings[@]}" \
              --output none
          else
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings AZURE_TOKEN_CREDENTIALS=prod Application__BuildNumber="$application_build_number" "${cloud_account_settings[@]}" "${azure_monitor_settings[@]}" "${billing_mode_settings[@]}" \
              --output none
          fi
          PAIRING_BEFORE_COUNT="$pairing_before_count" scripts/apply-external-engine-pairing-settings.sh
          scripts/apply-staging-billing-lifecycle-lever-settings.sh
          scripts/apply-staging-recovery-lifecycle-lever-settings.sh

          if [ -n "$production_billing_capture_path" ]; then
            python3 scripts/production_stripe_reconcile.py --reapply "$production_billing_capture_path"
          fi

          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --output none

      - name: Preview managed telemetry sink
        id: managed-telemetry-what-if
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'telemetry' && env.TELEMETRY_ACTION == 'what-if' && (env.TARGET_ENVIRONMENT == 'test' || env.TARGET_ENVIRONMENT == 'production') }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/deploy-managed-telemetry.sh --what-if

      - name: Deploy managed telemetry sink
        id: managed-telemetry
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'telemetry' && env.TELEMETRY_ACTION == 'create' && (env.TARGET_ENVIRONMENT == 'test' || env.TARGET_ENVIRONMENT == 'production') }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/deploy-managed-telemetry.sh

      - name: Reconcile staging Stripe billing
        id: staging-stripe
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.TARGET_ENVIRONMENT == 'test' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SIGNING_SECRET }}
          STRIPE_HOSTED_PRICE_ID: ${{ vars.STRIPE_HOSTED_PRICE_ID }}
          CONTROL_STAGING_WEBHOOK_URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/billing/webhooks/stripe
          CLOUD_PORTAL_RETURN_URL: ${{ vars.ELSA_CLOUD_STAGING_ORIGIN }}/dashboard
          AZURE_EXPECTED_CHECKOUT_SUCCESS_URL: ${{ vars.ELSA_CLOUD_STAGING_ORIGIN }}/checkout/return?session_id={CHECKOUT_SESSION_ID}
          AZURE_EXPECTED_CHECKOUT_CANCEL_URL: ${{ vars.ELSA_CLOUD_STAGING_ORIGIN }}/dashboard/billing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging_stripe_reconcile.py --apply-azure-settings

      - name: Verify deployed API health
        id: health-gate
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' }}
        env:
          VALIDATED_CANDIDATE_SOURCE_SHA: ${{ steps.candidate-authority.outputs.candidate_source_sha }}
          VALIDATED_CANDIDATE_BUILD_NUMBER: ${{ steps.candidate-authority.outputs.candidate_build_number }}
        shell: bash
        run: |
          set -euo pipefail

          if ! default_host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"; then
            echo "::error::Could not resolve the API host for the post-deployment health check."
            exit 1
          fi
          if [ -z "$default_host_name" ]; then
            echo "::error::Azure returned no API host for the post-deployment health check."
            exit 1
          fi
          health_url="https://$default_host_name/health"
          health_response_file="$(mktemp)"
          trap 'rm -f "$health_response_file"' EXIT
          stable_health_probes=0
          expected_image_id="$GITHUB_SHA"
          expected_build_number="$GITHUB_RUN_NUMBER"
          if [ "$DEPLOY_MODE" = "promote" ]; then
            expected_image_id="$VALIDATED_CANDIDATE_SOURCE_SHA"
            expected_build_number="$VALIDATED_CANDIDATE_BUILD_NUMBER"
            if [[ ! "$expected_image_id" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The validated candidate source identity is unavailable; refusing promotion health acceptance."
              exit 1
            fi
            if [[ ! "$expected_build_number" =~ ^[1-9][0-9]{0,19}$ ]]; then
              echo "::error::The validated candidate build number is unavailable; refusing promotion health acceptance."
              exit 1
            fi
            image_id_override_count="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query "[?name=='ELSA_CONTROL_IMAGE_ID'] | length(@)" \
              --output tsv \
              --only-show-errors)"
            if [ "$image_id_override_count" != "0" ]; then
              echo "::error::The Web App has a runtime image identity override; refusing promotion health acceptance."
              exit 1
            fi
          fi

          for attempt in $(seq 1 30); do
            if http_status="$(curl --silent --show-error --output "$health_response_file" --write-out '%{http_code}' --max-time 10 "$health_url")"; then
              if [ "$http_status" = "200" ] && jq -e \
                --arg expected_build_number "$expected_build_number" \
                --arg expected_image_id "$expected_image_id" \
                '.status == "ok" and .buildNumber == $expected_build_number and .imageId == $expected_image_id' \
                "$health_response_file" >/dev/null 2>&1; then
                stable_health_probes=$((stable_health_probes + 1))
                if [ "$stable_health_probes" -ge 2 ]; then
                  echo "API health check passed with HTTP 200 and the expected build/image identity on attempt $attempt."
                  exit 0
                fi
              else
                stable_health_probes=0
              fi
            else
              http_status=000
              stable_health_probes=0
            fi

            echo "API health check returned HTTP $http_status or an unexpected build/image identity (attempt $attempt/30, stable probes $stable_health_probes/2); retrying."
            sleep 10
          done

          echo "::error::API health check failed after deployment: $health_url"
          exit 1

      - name: Audit production Stripe billing
        id: production-stripe
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.TARGET_ENVIRONMENT == 'production' && env.DEPLOY_MODE != 'build' && env.DEPLOY_MODE != 'telemetry' }}
        env:
          STRIPE_PRODUCTION_PRICE_ID: ${{ vars.STRIPE_PRODUCTION_PRICE_ID }}
          CONTROL_PRODUCTION_WEBHOOK_URL: ${{ vars.CONTROL_PRODUCTION_WEBHOOK_URL }}
          AZURE_EXPECTED_PRODUCTION_PORTAL_RETURN_URL: ${{ vars.AZURE_EXPECTED_PRODUCTION_PORTAL_RETURN_URL }}
          AZURE_EXPECTED_PRODUCTION_CHECKOUT_SUCCESS_URL: ${{ vars.AZURE_EXPECTED_PRODUCTION_CHECKOUT_SUCCESS_URL }}
          AZURE_EXPECTED_PRODUCTION_CHECKOUT_CANCEL_URL: ${{ vars.AZURE_EXPECTED_PRODUCTION_CHECKOUT_CANCEL_URL }}
          AZURE_EXPECTED_PRODUCTION_CLOUD_PORTAL_RETURN_URL: ${{ vars.AZURE_EXPECTED_PRODUCTION_CLOUD_PORTAL_RETURN_URL }}
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
          PRODUCTION_BILLING_CAPTURE_PATH: ${{ runner.temp }}/elsa-control-production-billing.json
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/production_stripe_reconcile.py --audit --audit-capture "$PRODUCTION_BILLING_CAPTURE_PATH"

      - name: Restore previous API deployment after deployment, configuration, or health failure
        # API rollback triggers: deploy-api, staging Stripe configuration,
        # production Stripe audit, or the health gate. A telemetry
        # what-if/create/preflight failure never rolls back the API in
        # production, test, or development. Do not add managed-telemetry
        # or managed-telemetry-what-if outcomes here.
        if: ${{ failure() && steps.current-deployment.outcome == 'success' && steps.current-deployment.outputs.capture_succeeded == 'true' && (env.TARGET_ENVIRONMENT != 'production' || env.DEPLOY_MODE == 'build' || steps.production-billing-capture.outcome == 'success') && (steps.deploy-api.outcome == 'failure' || steps.staging-stripe.outcome == 'failure' || steps.production-stripe.outcome == 'failure' || steps.health-gate.outcome == 'failure') }}
        env:
          PREVIOUS_LINUX_FX_VERSION: ${{ steps.current-deployment.outputs.linux_fx_version }}
          PREVIOUS_DEPLOYMENT_MODE: ${{ steps.current-deployment.outputs.deployment_mode }}
          PREVIOUS_SITECONTAINER_IMAGE: ${{ steps.current-deployment.outputs.sitecontainer_image }}
          PREVIOUS_BUILD_NUMBER: ${{ steps.current-deployment.outputs.application_build_number }}
          PREVIOUS_BUILD_NUMBER_PRESENT: ${{ steps.current-deployment.outputs.application_build_number_present }}
          PREVIOUS_HEALTH_BUILD_NUMBER: ${{ steps.current-deployment.outputs.previous_health_build_number }}
          PREVIOUS_HEALTH_IMAGE_ID: ${{ steps.current-deployment.outputs.previous_health_image_id }}
          DEPLOY_API_OUTCOME: ${{ steps.deploy-api.outcome }}
          STAGING_STRIPE_OUTCOME: ${{ steps.staging-stripe.outcome }}
          PRODUCTION_STRIPE_OUTCOME: ${{ steps.production-stripe.outcome }}
          HEALTH_GATE_OUTCOME: ${{ steps.health-gate.outcome }}
          BILLING_EXPECTED_MODE: ${{ steps.deployment-config.outputs.billing_expected_mode }}
          PREVIOUS_BILLING_EXPECTED_MODE: ${{ steps.deploy-api.outputs.billing_expected_mode }}
          PREVIOUS_BILLING_EXPECTED_MODE_PRESENT: ${{ steps.deploy-api.outputs.billing_expected_mode_present }}
          PREVIOUS_BILLING_EXPECTED_MODE_SLOT_SETTING: ${{ steps.deploy-api.outputs.billing_expected_mode_slot_setting }}
          PREVIOUS_BILLING_STRIPE_ENABLED: ${{ steps.deploy-api.outputs.billing_stripe_enabled }}
          PREVIOUS_BILLING_STRIPE_ENABLED_PRESENT: ${{ steps.deploy-api.outputs.billing_stripe_enabled_present }}
          PREVIOUS_BILLING_STRIPE_ENABLED_SLOT_SETTING: ${{ steps.deploy-api.outputs.billing_stripe_enabled_slot_setting }}
          PREVIOUS_BILLING_LIFECYCLE_ENABLED: ${{ steps.deploy-api.outputs.billing_lifecycle_enabled }}
          PREVIOUS_BILLING_LIFECYCLE_ENABLED_PRESENT: ${{ steps.deploy-api.outputs.billing_lifecycle_enabled_present }}
          PREVIOUS_BILLING_LIFECYCLE_ENABLED_SLOT_SETTING: ${{ steps.deploy-api.outputs.billing_lifecycle_enabled_slot_setting }}
          PRODUCTION_BILLING_CAPTURE_PATH: ${{ runner.temp }}/elsa-control-production-billing.json
        shell: bash
        run: |
          set -euo pipefail

          if [ "$TARGET_ENVIRONMENT" = "production" ] && [ "$DEPLOY_MODE" != "build" ]; then
            python3 scripts/production_stripe_reconcile.py --reapply "$PRODUCTION_BILLING_CAPTURE_PATH"
          fi

          if [ "$PREVIOUS_DEPLOYMENT_MODE" = "classic" ]; then
            if ! az webapp config set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --linux-fx-version "$PREVIOUS_LINUX_FX_VERSION" \
                --output none; then
              echo "::error::Rollback failed: could not restore the previous Docker runtime image."
              exit 1
            fi
          elif [ "$PREVIOUS_DEPLOYMENT_MODE" = "sitecontainers" ]; then
            if [ -z "$PREVIOUS_SITECONTAINER_IMAGE" ]; then
              echo "::error::Rollback failed: the previous main sitecontainer image was not captured."
              exit 1
            fi
            if ! az webapp config set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --linux-fx-version "$PREVIOUS_LINUX_FX_VERSION" \
                --output none; then
              echo "::error::Rollback failed: could not restore the SITECONTAINERS runtime."
              exit 1
            fi
            if ! az webapp sitecontainers update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-name main \
                --image "$PREVIOUS_SITECONTAINER_IMAGE" \
                --is-main true \
                --output none; then
              echo "::error::Rollback failed: could not restore the previous main sitecontainer image."
              exit 1
            fi
          else
            echo "::error::Rollback failed: the captured deployment mode is unsupported."
            exit 1
          fi

          if [ "$PREVIOUS_BUILD_NUMBER_PRESENT" = true ]; then
            if ! az webapp config appsettings set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --settings "Application__BuildNumber=$PREVIOUS_BUILD_NUMBER" \
                --output none; then
              echo "::error::Rollback failed: could not restore the previous Application__BuildNumber."
              exit 1
            fi
          else
            if ! az webapp config appsettings delete \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --setting-names Application__BuildNumber \
                --output none; then
              echo "::error::Rollback failed: could not remove the previous Application__BuildNumber."
              exit 1
            fi
          fi

          # Restore ExpectedMode and billing enablement as one coherent pair
          # for every API rollback trigger. Staging reconciliation can enable
          # billing after a successful image switch; deleting ExpectedMode
          # while leaving billing enabled is not a runnable restore.
          # An unset PRESENT means the read never completed, so that setting
          # was not captured and is left untouched. Enablement is restored
          # first so a later ExpectedMode failure cannot leave billing
          # enabled without a valid mode. Secret values stay out of outputs.
          if [ "$DEPLOY_MODE" = "app" ] || [ "$DEPLOY_MODE" = "promote" ]; then
            billing_mode_pattern='^(test|live|staging|production)$'
            # Enablement flags use the same case-insensitive Boolean semantics
            # as scripts/production_stripe_reconcile.py (.strip().lower()).
            # Restore writes the exact original captured string.
            trim_billing_setting() {
              local raw="$1"
              raw="${raw#"${raw%%[![:space:]]*}"}"
              raw="${raw%"${raw##*[![:space:]]}"}"
              printf '%s' "$raw"
            }
            billing_enabled_normalized() {
              local trimmed
              trimmed="$(trim_billing_setting "$1")"
              printf '%s' "${trimmed,,}"
            }
            is_billing_enabled_flag() {
              local normalized
              normalized="$(billing_enabled_normalized "$1")"
              [ "$normalized" = "true" ] || [ "$normalized" = "false" ]
            }
            billing_flag_is_true() {
              [ "$(billing_enabled_normalized "${1:-}")" = "true" ]
            }
            billing_restore_value_ok() {
              local value_kind="$1"
              local candidate="$2"
              if [ "$value_kind" = "enabled" ]; then
                is_billing_enabled_flag "$candidate"
              else
                [[ "$candidate" =~ $billing_mode_pattern ]]
              fi
            }
            restore_captured_appsetting() {
              local setting_name="$1"
              local present="$2"
              local value="$3"
              local slot_setting="$4"
              local value_kind="$5"
              local keep_value="${6:-}"
              if [ "$present" = true ]; then
                if ! billing_restore_value_ok "$value_kind" "$value"; then
                  echo "::error::Rollback failed: the captured ${setting_name} has an unexpected or unsafe format."
                  exit 1
                fi
                local setting_flag=--settings
                if [ "$slot_setting" = true ]; then
                  setting_flag=--slot-settings
                fi
                if ! az webapp config appsettings set \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$AZURE_WEBAPP_NAME" \
                    "$setting_flag" "${setting_name}=${value}" \
                    --output none; then
                  echo "::error::Rollback failed: could not restore the previous ${setting_name}."
                  exit 1
                fi
              elif [ "$present" = false ]; then
                if [ -n "$keep_value" ]; then
                  if ! billing_restore_value_ok "$value_kind" "$keep_value"; then
                    echo "::error::Rollback failed: the replacement ${setting_name} has an unexpected or unsafe format."
                    exit 1
                  fi
                  if ! az webapp config appsettings set \
                      --resource-group "$AZURE_RESOURCE_GROUP" \
                      --name "$AZURE_WEBAPP_NAME" \
                      --settings "${setting_name}=${keep_value}" \
                      --output none; then
                    echo "::error::Rollback failed: could not keep a valid ${setting_name} for the restored billing configuration."
                    exit 1
                  fi
                elif ! az webapp config appsettings delete \
                    --resource-group "$AZURE_RESOURCE_GROUP" \
                    --name "$AZURE_WEBAPP_NAME" \
                    --setting-names "$setting_name" \
                    --output none; then
                  echo "::error::Rollback failed: could not remove the newly introduced ${setting_name}."
                  exit 1
                fi
              fi
            }

            keep_expected_mode=""
            if [ "${PREVIOUS_BILLING_EXPECTED_MODE_PRESENT:-}" = false ] &&
               [ "${PREVIOUS_BILLING_STRIPE_ENABLED_PRESENT:-}" = true ] &&
               billing_flag_is_true "${PREVIOUS_BILLING_STRIPE_ENABLED:-}"; then
              if [ -z "${BILLING_EXPECTED_MODE:-}" ] || [[ ! "$BILLING_EXPECTED_MODE" =~ $billing_mode_pattern ]]; then
                echo "::error::Rollback failed: captured billing is enabled without a restorable ExpectedMode."
                exit 1
              fi
              keep_expected_mode="$BILLING_EXPECTED_MODE"
            fi

            restore_captured_appsetting \
              "Billing__Stripe__Enabled" \
              "${PREVIOUS_BILLING_STRIPE_ENABLED_PRESENT:-}" \
              "${PREVIOUS_BILLING_STRIPE_ENABLED:-}" \
              "${PREVIOUS_BILLING_STRIPE_ENABLED_SLOT_SETTING:-}" \
              "enabled"
            restore_captured_appsetting \
              "Billing__Lifecycle__Enabled" \
              "${PREVIOUS_BILLING_LIFECYCLE_ENABLED_PRESENT:-}" \
              "${PREVIOUS_BILLING_LIFECYCLE_ENABLED:-}" \
              "${PREVIOUS_BILLING_LIFECYCLE_ENABLED_SLOT_SETTING:-}" \
              "enabled"
            restore_captured_appsetting \
              "Billing__Stripe__ExpectedMode" \
              "${PREVIOUS_BILLING_EXPECTED_MODE_PRESENT:-}" \
              "${PREVIOUS_BILLING_EXPECTED_MODE:-}" \
              "${PREVIOUS_BILLING_EXPECTED_MODE_SLOT_SETTING:-}" \
              "mode" \
              "$keep_expected_mode"
          fi

          if ! az webapp restart \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --output none; then
            echo "::error::Rollback failed: could not restart the API after restoring the previous deployment."
            exit 1
          fi

          if [ "$PREVIOUS_DEPLOYMENT_MODE" = "classic" ]; then
            if ! restored_runtime_image="$(az webapp config show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query linuxFxVersion \
              --output tsv)"; then
              echo "::error::Rollback failed: could not verify the restored Docker runtime image."
              exit 1
            fi
          else
            if ! restored_runtime_image="$(az webapp sitecontainers show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --container-name main \
              --query image \
              --output tsv)"; then
              echo "::error::Rollback failed: could not verify the restored main sitecontainer image."
              exit 1
            fi
          fi
          if [ "$PREVIOUS_DEPLOYMENT_MODE" = "classic" ]; then
            if [ "$restored_runtime_image" != "$PREVIOUS_LINUX_FX_VERSION" ]; then
              echo "::error::Rollback failed: Azure is not configured with the captured previous Docker runtime image."
              exit 1
            fi
          elif [ "$restored_runtime_image" != "$PREVIOUS_SITECONTAINER_IMAGE" ]; then
            echo "::error::Rollback failed: Azure is not configured with the captured previous main sitecontainer image."
            exit 1
          fi

          expected_previous_build_number="${PREVIOUS_HEALTH_BUILD_NUMBER:-${PREVIOUS_BUILD_NUMBER:-unknown}}"
          expected_previous_image_id="${PREVIOUS_HEALTH_IMAGE_ID:-}"
          # shellcheck disable=SC2016 # The jq variables intentionally expand inside jq, not Bash.
          if [ -n "$expected_previous_image_id" ]; then
            expected_previous_health_query='.status == "ok" and .buildNumber == $expected_build_number and .imageId == $expected_image_id'
            echo "Rollback health will require the captured previous build and image identity."
          else
            expected_previous_health_query='.status == "ok" and ((.buildNumber // $expected_build_number) == $expected_build_number)'
            echo "::notice::Rollback health is using the explicit legacy-image compatibility path because the pre-deploy health response had no safe embedded image identity; Azure image configuration was matched to the captured reference."
          fi

          if ! default_host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"; then
            echo "::error::Rollback failed: could not resolve the API host after restoring the previous deployment."
            exit 1
          fi
          if [ -z "$default_host_name" ]; then
            echo "::error::Rollback failed: Azure returned no API host after restoring the previous deployment."
            exit 1
          fi

          rollback_health_url="https://$default_host_name/health"
          rollback_health_response_file="$(mktemp)"
          trap 'rm -f "$rollback_health_response_file"' EXIT
          rollback_health_succeeded=false
          stable_rollback_health_probes=0
          for attempt in $(seq 1 30); do
            if http_status="$(curl --silent --show-error --output "$rollback_health_response_file" --write-out '%{http_code}' --max-time 10 "$rollback_health_url")"; then
              if [ "$http_status" = "200" ] && jq -e \
                --arg expected_build_number "$expected_previous_build_number" \
                --arg expected_image_id "$expected_previous_image_id" \
                "$expected_previous_health_query" \
                "$rollback_health_response_file" >/dev/null 2>&1; then
                stable_rollback_health_probes=$((stable_rollback_health_probes + 1))
                if [ "$stable_rollback_health_probes" -ge 2 ]; then
                  rollback_health_succeeded=true
                  echo "Rollback health check passed with HTTP 200 and the expected previous build identity on attempt $attempt."
                  break
                fi
              else
                stable_rollback_health_probes=0
              fi
            else
              http_status=000
              stable_rollback_health_probes=0
            fi

            echo "Rollback health check returned HTTP $http_status or an unexpected build identity (attempt $attempt/30, stable probes $stable_rollback_health_probes/2); retrying."
            sleep 10
          done

          if [ "$rollback_health_succeeded" != true ]; then
            echo "::error::Rollback failed: the previous API deployment did not return HTTP 200 at $rollback_health_url."
            exit 1
          fi

          rollback_triggers=()
          if [ "${DEPLOY_API_OUTCOME:-}" = "failure" ]; then
            rollback_triggers+=("API deployment")
          fi
          if [ "${STAGING_STRIPE_OUTCOME:-}" = "failure" ]; then
            rollback_triggers+=("staging Stripe configuration")
          fi
          if [ "${PRODUCTION_STRIPE_OUTCOME:-}" = "failure" ]; then
            rollback_triggers+=("production Stripe audit")
          fi
          if [ "${HEALTH_GATE_OUTCOME:-}" = "failure" ]; then
            rollback_triggers+=("API health gate")
          fi
          if [ "${#rollback_triggers[@]}" -eq 0 ]; then
            rollback_trigger="deployment, configuration, or health"
          else
            rollback_trigger="$(IFS=', '; echo "${rollback_triggers[*]}")"
          fi
          echo "::error::${rollback_trigger} failed; restored the previous deployment image and build metadata."

      - name: Report recovery path for a new test environment
        if: ${{ failure() && env.TARGET_ENVIRONMENT == 'test' && env.DEPLOY_MODE == 'infra' && steps.current-deployment.outcome == 'success' && steps.current-deployment.outputs.capture_succeeded != 'true' && (steps.deploy-api.outcome == 'failure' || steps.staging-stripe.outcome == 'failure' || steps.health-gate.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::No previous API runtime existed, so an image rollback is unavailable. The isolated test resources are retained for diagnosis; correct the failed gate and rerun the idempotent infra deployment. Delete the test resource group only through the documented environment teardown procedure."

      - name: Clean up captured production Stripe billing settings
        if: ${{ always() }}
        env:
          PRODUCTION_BILLING_CAPTURE_PATH: ${{ runner.temp }}/elsa-control-production-billing.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$PRODUCTION_BILLING_CAPTURE_PATH"
