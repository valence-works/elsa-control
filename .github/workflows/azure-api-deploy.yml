name: Azure Control API Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub environment to deploy."
        required: true
        default: production
        type: choice
        options:
          - development
          - test
          - production
      deploy_mode:
        description: "Use app for code-only deployment, infra for Bicep, build to stage, or promote an immutable candidate."
        required: true
        default: app
        type: choice
        options:
          - app
          - infra
          - build
          - promote
      candidate_run_id:
        description: "Successful same-repository build workflow run containing the candidate descriptor (promote only)."
        required: false
        type: string
      candidate_digest:
        description: "Expected candidate image digest, including the sha256: prefix (promote only)."
        required: false
        type: string

concurrency:
  group: azure-api-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and Deploy Control API
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'app' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      EXPECTED_CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Hosting/ElsaControl.Console/package-lock.json

      - name: Check deployment configuration
        id: deployment-config
        env:
          SQL_ADMINISTRATOR_LOGIN: ${{ env.DEPLOY_MODE == 'infra' && vars.SQL_ADMINISTRATOR_LOGIN || '' }}
          ADMIN_API_KEY: ${{ env.DEPLOY_MODE == 'infra' && secrets.ADMIN_API_KEY || '' }}
          SQL_ADMINISTRATOR_PASSWORD: ${{ env.DEPLOY_MODE == 'infra' && secrets.SQL_ADMINISTRATOR_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail

          case "$DEPLOY_MODE" in
            app|infra|build|promote) ;;
            *)
              echo "::error::Unsupported deployment mode; refusing to continue."
              exit 1
              ;;
          esac

          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_CONTAINER_REGISTRY_ENDPOINT
          )

          if [ "$DEPLOY_MODE" != "build" ]; then
            required+=(
              AZURE_ENV_NAME
              AZURE_LOCATION
              AZURE_RESOURCE_GROUP
              AZURE_WEBAPP_NAME
            )
          fi

          if [ "$DEPLOY_MODE" = "infra" ]; then
            required+=(
              ADMIN_API_KEY
              SQL_ADMINISTRATOR_PASSWORD
            )
          fi

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "deploy_configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing_names="$(IFS=', '; echo "${missing[*]}")"
          echo "deploy_configured=false" >> "$GITHUB_OUTPUT"
          echo "missing_names=$missing_names" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Deployment configuration is incomplete. Missing: $missing_names"
            exit 1
          fi

          echo "::notice::Deployment skipped because configuration is incomplete. Missing: $missing_names"

      - name: Require main ref for Azure mutation
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Azure deployment and candidate publication are permitted only from the main branch; refusing to continue."
            exit 1
          fi

      - name: Restore
        run: dotnet restore ElsaControl.sln

      - name: Build AppHost
        run: dotnet build src/Hosting/ElsaControl.AppHost/ElsaControl.AppHost.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test tests/Hosting/ElsaControl.Api.Tests/ElsaControl.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Build and test console
        working-directory: src/Hosting/ElsaControl.Console
        run: |
          npm ci
          npm test
          npm run build

      - name: Log in Azure CLI
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check immutable promotion inputs
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'promote' }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::A successful candidate run identity is required for immutable promotion."
            exit 1
          }
          [[ "$EXPECTED_CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::An expected immutable candidate digest is required for promotion."
            exit 1
          }
          [[ "$AZURE_CONTAINER_REGISTRY_ENDPOINT" =~ ^[a-z0-9][a-z0-9.-]*\.azurecr\.io$ ]] || {
            echo "::error::The configured container registry endpoint has an unexpected format; refusing promotion."
            exit 1
          }

      - name: Download trusted API candidate descriptor
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'promote' }}
        uses: actions/download-artifact@v4
        with:
          name: elsa-control-api-candidate
          path: ${{ runner.temp }}/elsa-control-api-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Validate trusted API candidate
        id: candidate-authority
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'promote' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          scripts/validate-azure-api-candidate.sh \
            "$RUNNER_TEMP/elsa-control-api-candidate/candidate.json" \
            "$CANDIDATE_RUN_ID" \
            "$EXPECTED_CANDIDATE_DIGEST" \
            "$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_OUTPUT"

      - name: Verify candidate image in ACR
        if: ${{ success() && steps.candidate-authority.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"
          if ! candidate_digest="$(az acr manifest show-metadata \
            --registry "$acr_name" \
            --name "elsa-control/api@$EXPECTED_CANDIDATE_DIGEST" \
            --query digest \
            --output tsv \
            --only-show-errors 2>/dev/null)"; then
            echo "::error::The validated candidate image is not present in the configured registry; refusing promotion."
            exit 1
          fi
          if [ "$candidate_digest" != "$EXPECTED_CANDIDATE_DIGEST" ]; then
            echo "::error::The configured registry returned a different candidate digest; refusing promotion."
            exit 1
          fi

      - name: Build and publish API candidate
        id: candidate-image
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE == 'build' }}
        shell: bash
        run: |
          set -euo pipefail

          command -v jq >/dev/null 2>&1 || {
            echo "::error::JSON tooling is unavailable; refusing to emit a candidate descriptor."
            exit 1
          }
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The build source identity has an unexpected format; refusing to publish a candidate."
            exit 1
          fi
          if [[ ! "$AZURE_CONTAINER_REGISTRY_ENDPOINT" =~ ^[a-z0-9][a-z0-9.-]*\.azurecr\.io$ ]]; then
            echo "::error::The configured container registry endpoint has an unexpected format; refusing to publish a candidate."
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::The build run identity has an unexpected format; refusing to publish a candidate."
            exit 1
          fi

          acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          image="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api:$candidate_tag"
          image_repository="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api"
          candidate_descriptor_directory="$RUNNER_TEMP/elsa-control-api-candidate"
          candidate_descriptor="$candidate_descriptor_directory/candidate.json"
          mkdir -p "$candidate_descriptor_directory"

          az acr login --name "$acr_name" --only-show-errors
          docker build \
            --build-arg ELSA_CONTROL_IMAGE_ID="$GITHUB_SHA" \
            --file src/Hosting/ElsaControl.Api/Dockerfile \
            --tag "$image" \
            .
          docker push "$image"

          digest="$(az acr manifest show-metadata \
            --registry "$acr_name" \
            --name "elsa-control/api:$candidate_tag" \
            --query digest \
            --output tsv \
            --only-show-errors)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The published candidate did not resolve to an immutable digest; refusing to emit a candidate descriptor."
            exit 1
          fi

          jq -n \
            --arg repository "$image_repository" \
            --arg digest "$digest" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg build_run_id "$GITHUB_RUN_ID" \
            --arg build_run_number "$GITHUB_RUN_NUMBER" \
            '{artifactSchemaVersion: 1, repository: $repository, digest: $digest,
              sourceRepository: $source_repository, sourceSha: $source_sha,
              buildRunId: $build_run_id, buildRunNumber: $build_run_number}' \
            > "$candidate_descriptor"
          printf 'descriptor_path=%s\n' "$candidate_descriptor" >> "$GITHUB_OUTPUT"

      - name: Upload API candidate descriptor
        if: ${{ success() && steps.candidate-image.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: elsa-control-api-candidate
          path: ${{ steps.candidate-image.outputs.descriptor_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Capture current API deployment
        id: current-deployment
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE != 'build' }}
        shell: bash
        run: |
          set -euo pipefail

          webapp_probe_file="$(mktemp)"
          trap 'rm -f "$webapp_probe_file"' EXIT
          if ! current_webapp_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query name \
            --output tsv \
            --only-show-errors 2>"$webapp_probe_file")"; then
            if [ "$DEPLOY_MODE" = "infra" ] && grep -Eq 'Resource(NotFound|GroupNotFound)|was not found' "$webapp_probe_file"; then
              echo "capture_succeeded=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping previous deployment capture because the Web App does not exist yet; infra deployment will create it."
              exit 0
            fi

            echo "::error::Could not determine whether the current Web App exists; refusing an unprotected deployment."
            exit 1
          fi
          if [ -z "$current_webapp_name" ]; then
            echo "::error::Azure returned no Web App name; refusing an unprotected deployment."
            exit 1
          fi

          if ! linux_fx_version="$(az webapp config show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query linuxFxVersion \
            --output tsv)"; then
            echo "::error::Could not capture the current Linux runtime image; refusing an unprotected deployment."
            exit 1
          fi
          if [ -z "$linux_fx_version" ]; then
            echo "::error::Could not capture the current Linux runtime image; refusing an unprotected deployment."
            exit 1
          fi

          image_reference_pattern='([[:alnum:]][[:alnum:].-]*)(:[[:digit:]]+)?/[[:alnum:]][[:alnum:]._/-]*(:[[:alnum:]][[:alnum:]._+-]*)?(@sha256:[[:xdigit:]]{64})?'
          deployment_mode=""
          sitecontainer_image=""
          if [[ "$linux_fx_version" =~ ^DOCKER\|$image_reference_pattern$ ]]; then
            deployment_mode=classic
          elif [ "$linux_fx_version" = "SITECONTAINERS" ]; then
            deployment_mode=sitecontainers
            if ! sitecontainer_image="$(az webapp sitecontainers show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --container-name main \
              --query properties.image \
              --output tsv)"; then
              echo "::error::Could not capture the current main sitecontainer image; refusing an unprotected deployment."
              exit 1
            fi
            if [[ ! "$sitecontainer_image" =~ ^$image_reference_pattern$ ]]; then
              echo "::error::The captured main sitecontainer image has an unexpected or unsafe format."
              exit 1
            fi
          else
            echo "::error::The captured Linux runtime has an unsupported format; expected DOCKER|... or SITECONTAINERS."
            exit 1
          fi

          rollback_linux_fx_version="$linux_fx_version"
          rollback_sitecontainer_image="$sitecontainer_image"
          if [ "$DEPLOY_MODE" = "promote" ]; then
            if [[ ! "$AZURE_CONTAINER_REGISTRY_ENDPOINT" =~ ^[a-z0-9][a-z0-9.-]*\.azurecr\.io$ ]]; then
              echo "::error::The configured container registry endpoint has an unexpected format; refusing promotion."
              exit 1
            fi

            expected_image_repository="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api"
            acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"
            if [ "$deployment_mode" = "classic" ]; then
              current_image="${linux_fx_version#DOCKER|}"
            else
              current_image="$sitecontainer_image"
            fi

            case "$current_image" in
              "$expected_image_repository"@*)
                previous_digest="${current_image#"$expected_image_repository"@}"
                ;;
              "$expected_image_repository":*)
                previous_tag="${current_image#"$expected_image_repository":}"
                if [[ ! "$previous_tag" =~ ^[[:alnum:]][[:alnum:]._+-]{0,127}$ ]]; then
                  echo "::error::The captured previous image tag has an unexpected format; refusing promotion."
                  exit 1
                fi
                if ! previous_digest="$(az acr manifest show-metadata \
                  --registry "$acr_name" \
                  --name "elsa-control/api:$previous_tag" \
                  --query digest \
                  --output tsv \
                  --only-show-errors 2>/dev/null)"; then
                  echo "::error::The captured previous image could not be resolved to an immutable digest; refusing promotion."
                  exit 1
                fi
                ;;
              *)
                echo "::error::The captured previous image is not owned by the configured API repository; refusing promotion."
                exit 1
                ;;
            esac

            if [[ ! "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The captured previous image did not resolve to an immutable digest; refusing promotion."
              exit 1
            fi
            if ! verified_previous_digest="$(az acr manifest show-metadata \
              --registry "$acr_name" \
              --name "elsa-control/api@$previous_digest" \
              --query digest \
              --output tsv \
              --only-show-errors 2>/dev/null)"; then
              echo "::error::The captured previous image digest could not be verified in the configured repository; refusing promotion."
              exit 1
            fi
            if [ "$verified_previous_digest" != "$previous_digest" ]; then
              echo "::error::The captured previous image digest did not match the configured repository; refusing promotion."
              exit 1
            fi

            rollback_image="$expected_image_repository@$previous_digest"
            if [ "$deployment_mode" = "classic" ]; then
              rollback_linux_fx_version="DOCKER|$rollback_image"
            else
              rollback_sitecontainer_image="$rollback_image"
            fi

            image_id_override_count="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query "[?name=='ELSA_CONTROL_IMAGE_ID'] | length(@)" \
              --output tsv \
              --only-show-errors)"
            if [ "$image_id_override_count" != "0" ]; then
              echo "::error::The Web App has a runtime image identity override; refusing promotion."
              exit 1
            fi
          fi

          application_build_number="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query "[?name=='Application__BuildNumber'] | [0].value" \
            --output tsv)"
          if [ "$application_build_number" = "None" ]; then
            application_build_number=""
          fi

          safe_identifier_pattern='^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$'
          if [ -n "$application_build_number" ]; then
            if [[ ! "$application_build_number" =~ $safe_identifier_pattern ]]; then
              echo "::error::The captured Application__BuildNumber has an unexpected or unsafe format."
              exit 1
            fi

            echo "application_build_number_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "application_build_number_present=false" >> "$GITHUB_OUTPUT"
          fi

          if ! default_host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"; then
            echo "::error::Could not resolve the current API host for deployment identity capture; refusing an unprotected deployment."
            exit 1
          fi
          if [ -z "$default_host_name" ]; then
            echo "::error::Azure returned no current API host for deployment identity capture; refusing an unprotected deployment."
            exit 1
          fi
          health_response_file="$(mktemp)"
          trap 'rm -f "$webapp_probe_file" "$health_response_file"' EXIT
          health_url="https://$default_host_name/health"
          previous_health_build_number=""
          previous_health_image_id=""
          if ! http_status="$(curl --silent --show-error --output "$health_response_file" --write-out '%{http_code}' --max-time 10 "$health_url")"; then
            http_status=000
          fi
          if [ "$http_status" = "200" ] && jq -e '.status == "ok"' "$health_response_file" >/dev/null 2>&1; then
            if jq -e 'type == "object"' "$health_response_file" >/dev/null 2>&1; then
              previous_health_build_number="$(jq -r '.buildNumber // empty' "$health_response_file")"
              previous_health_image_id="$(jq -r '.imageId // empty' "$health_response_file")"
              if [ "$previous_health_build_number" = "unknown" ]; then
                previous_health_build_number=""
              fi
              if [ "$previous_health_image_id" = "unknown" ]; then
                previous_health_image_id=""
              fi
              for identifier in previous_health_build_number previous_health_image_id; do
                value="${!identifier}"
                if [ -n "$value" ] && [[ ! "$value" =~ $safe_identifier_pattern ]]; then
                  echo "::error::The current API health response contains an unexpected or unsafe $identifier; refusing an unprotected deployment."
                  exit 1
                fi
              done
              echo "Captured safe current API build/image identity for rollback verification."
            else
              echo "::notice::The current API health response had no object identity fields; retaining Azure image/build metadata and using rollback compatibility verification."
            fi
          else
            previous_health_build_number=""
            previous_health_image_id=""
            echo "::notice::Current API health was unavailable or not healthy at $health_url (HTTP ${http_status:-000}); retaining Azure image/build metadata and using rollback compatibility verification."
          fi
          echo "deployment_mode=$deployment_mode" >> "$GITHUB_OUTPUT"
          echo "linux_fx_version=$rollback_linux_fx_version" >> "$GITHUB_OUTPUT"
          if [ -n "$rollback_sitecontainer_image" ]; then
            echo "sitecontainer_image=$rollback_sitecontainer_image" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$application_build_number" ]; then
            echo "application_build_number=$application_build_number" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$previous_health_build_number" ]; then
            echo "previous_health_build_number=$previous_health_build_number" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$previous_health_image_id" ]; then
            echo "previous_health_image_id=$previous_health_image_id" >> "$GITHUB_OUTPUT"
          fi
          echo "capture_succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Deploy API app
        id: deploy-api
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE != 'build' }}
        env:
          VALIDATED_CANDIDATE_IMAGE: ${{ steps.candidate-authority.outputs.candidate_image }}
          VALIDATED_CANDIDATE_BUILD_NUMBER: ${{ steps.candidate-authority.outputs.candidate_build_number }}
          SQL_ADMINISTRATOR_LOGIN: ${{ env.DEPLOY_MODE == 'infra' && vars.SQL_ADMINISTRATOR_LOGIN || '' }}
          ADMIN_API_KEY: ${{ env.DEPLOY_MODE == 'infra' && secrets.ADMIN_API_KEY || '' }}
          BUILDER_CLIENT_API_KEY: ${{ env.DEPLOY_MODE == 'infra' && secrets.BUILDER_CLIENT_API_KEY || '' }}
          SQL_ADMINISTRATOR_PASSWORD: ${{ env.DEPLOY_MODE == 'infra' && secrets.SQL_ADMINISTRATOR_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$DEPLOY_MODE" = "infra" ]; then
            scripts/deploy-azure-elsa-control.sh \
              --environment "$AZURE_ENV_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --image-tag "$GITHUB_SHA"
          elif [ "$DEPLOY_MODE" = "app" ]; then
            image="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api:${GITHUB_SHA}"
            acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"
            current_deployment_mode="${{ steps.current-deployment.outputs.deployment_mode }}"

            az acr login --name "$acr_name"
            docker build \
              --build-arg ELSA_CONTROL_IMAGE_ID="$GITHUB_SHA" \
              --file src/Hosting/ElsaControl.Api/Dockerfile \
              --tag "$image" \
              .
            docker push "$image"

            if [ "$current_deployment_mode" = "sitecontainers" ]; then
              az webapp sitecontainers update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-name main \
                --image "$image" \
                --is-main true \
                --output none
            elif [ "$current_deployment_mode" = "classic" ]; then
              az webapp config container set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-image-name "$image" \
                --container-registry-url "https://$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
                --output none
            else
              echo "::error::The captured deployment mode is unsupported; refusing an unprotected deployment."
              exit 1
            fi
          elif [ "$DEPLOY_MODE" = "promote" ]; then
            image="$VALIDATED_CANDIDATE_IMAGE"
            current_deployment_mode="${{ steps.current-deployment.outputs.deployment_mode }}"
            expected_image_repository="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api"
            if [[ "$image" != "$expected_image_repository"@sha256:* ]]; then
              echo "::error::The candidate image is not the validated immutable repository reference; refusing promotion."
              exit 1
            fi
            candidate_digest="${image#"$expected_image_repository"@}"
            if [[ ! "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The candidate image digest has an unexpected format; refusing promotion."
              exit 1
            fi

            if [ "$current_deployment_mode" = "sitecontainers" ]; then
              az webapp sitecontainers update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-name main \
                --image "$image" \
                --is-main true \
                --output none
            elif [ "$current_deployment_mode" = "classic" ]; then
              az webapp config container set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-image-name "$image" \
                --container-registry-url "https://$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
                --output none
            else
              echo "::error::The captured deployment mode is unsupported; refusing promotion."
              exit 1
            fi

            expected_runtime_reference="$image"
            if [ "$current_deployment_mode" = "classic" ]; then
              expected_runtime_reference="DOCKER|$image"
              if ! configured_runtime_reference="$(az webapp config show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --query linuxFxVersion \
                --output tsv \
                --only-show-errors)"; then
                echo "::error::The promoted Docker runtime could not be read back; refusing promotion acceptance."
                exit 1
              fi
            else
              if ! configured_runtime_reference="$(az webapp sitecontainers show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-name main \
                --query properties.image \
                --output tsv \
                --only-show-errors)"; then
                echo "::error::The promoted main sitecontainer could not be read back; refusing promotion acceptance."
                exit 1
              fi
            fi
            if [ "$configured_runtime_reference" != "$expected_runtime_reference" ]; then
              echo "::error::The promoted runtime did not match the validated immutable image; refusing promotion acceptance."
              exit 1
            fi
          else
            echo "::error::The selected deployment mode cannot mutate the Web App."
            exit 1
          fi

          # A promoted image keeps the build number of the run that built and validated it;
          # the promotion run number is not a build identity.
          application_build_number="$GITHUB_RUN_NUMBER"
          if [ "$DEPLOY_MODE" = "promote" ]; then
            application_build_number="$VALIDATED_CANDIDATE_BUILD_NUMBER"
            if [[ ! "$application_build_number" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "::error::The validated candidate build number is unavailable; refusing promotion."
              exit 1
            fi
          fi
          if [ "$DEPLOY_MODE" = "infra" ]; then
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings Application__BuildNumber="$application_build_number" \
              --output none
          else
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings AZURE_TOKEN_CREDENTIALS=prod Application__BuildNumber="$application_build_number" \
              --output none
          fi

          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --output none

      - name: Verify deployed API health
        id: health-gate
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' && env.DEPLOY_MODE != 'build' }}
        env:
          VALIDATED_CANDIDATE_SOURCE_SHA: ${{ steps.candidate-authority.outputs.candidate_source_sha }}
          VALIDATED_CANDIDATE_BUILD_NUMBER: ${{ steps.candidate-authority.outputs.candidate_build_number }}
        shell: bash
        run: |
          set -euo pipefail

          if ! default_host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"; then
            echo "::error::Could not resolve the API host for the post-deployment health check."
            exit 1
          fi
          if [ -z "$default_host_name" ]; then
            echo "::error::Azure returned no API host for the post-deployment health check."
            exit 1
          fi
          health_url="https://$default_host_name/health"
          health_response_file="$(mktemp)"
          trap 'rm -f "$health_response_file"' EXIT
          stable_health_probes=0
          expected_image_id="$GITHUB_SHA"
          expected_build_number="$GITHUB_RUN_NUMBER"
          if [ "$DEPLOY_MODE" = "promote" ]; then
            expected_image_id="$VALIDATED_CANDIDATE_SOURCE_SHA"
            expected_build_number="$VALIDATED_CANDIDATE_BUILD_NUMBER"
            if [[ ! "$expected_image_id" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The validated candidate source identity is unavailable; refusing promotion health acceptance."
              exit 1
            fi
            if [[ ! "$expected_build_number" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "::error::The validated candidate build number is unavailable; refusing promotion health acceptance."
              exit 1
            fi
            image_id_override_count="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query "[?name=='ELSA_CONTROL_IMAGE_ID'] | length(@)" \
              --output tsv \
              --only-show-errors)"
            if [ "$image_id_override_count" != "0" ]; then
              echo "::error::The Web App has a runtime image identity override; refusing promotion health acceptance."
              exit 1
            fi
          fi

          for attempt in $(seq 1 30); do
            if http_status="$(curl --silent --show-error --output "$health_response_file" --write-out '%{http_code}' --max-time 10 "$health_url")"; then
              if [ "$http_status" = "200" ] && jq -e \
                --arg expected_build_number "$expected_build_number" \
                --arg expected_image_id "$expected_image_id" \
                '.status == "ok" and .buildNumber == $expected_build_number and .imageId == $expected_image_id' \
                "$health_response_file" >/dev/null 2>&1; then
                stable_health_probes=$((stable_health_probes + 1))
                if [ "$stable_health_probes" -ge 2 ]; then
                  echo "API health check passed with HTTP 200 and the expected build/image identity on attempt $attempt."
                  exit 0
                fi
              else
                stable_health_probes=0
              fi
            else
              http_status=000
              stable_health_probes=0
            fi

            echo "API health check returned HTTP $http_status or an unexpected build/image identity (attempt $attempt/30, stable probes $stable_health_probes/2); retrying."
            sleep 10
          done

          echo "::error::API health check failed after deployment: $health_url"
          exit 1

      - name: Restore previous API deployment after deployment or health failure
        if: ${{ failure() && steps.current-deployment.outcome == 'success' && steps.current-deployment.outputs.capture_succeeded == 'true' && (steps.deploy-api.outcome == 'failure' || steps.health-gate.outcome == 'failure') }}
        env:
          PREVIOUS_LINUX_FX_VERSION: ${{ steps.current-deployment.outputs.linux_fx_version }}
          PREVIOUS_DEPLOYMENT_MODE: ${{ steps.current-deployment.outputs.deployment_mode }}
          PREVIOUS_SITECONTAINER_IMAGE: ${{ steps.current-deployment.outputs.sitecontainer_image }}
          PREVIOUS_BUILD_NUMBER: ${{ steps.current-deployment.outputs.application_build_number }}
          PREVIOUS_BUILD_NUMBER_PRESENT: ${{ steps.current-deployment.outputs.application_build_number_present }}
          PREVIOUS_HEALTH_BUILD_NUMBER: ${{ steps.current-deployment.outputs.previous_health_build_number }}
          PREVIOUS_HEALTH_IMAGE_ID: ${{ steps.current-deployment.outputs.previous_health_image_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PREVIOUS_DEPLOYMENT_MODE" = "classic" ]; then
            if ! az webapp config set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --linux-fx-version "$PREVIOUS_LINUX_FX_VERSION" \
                --output none; then
              echo "::error::Rollback failed: could not restore the previous Docker runtime image."
              exit 1
            fi
          elif [ "$PREVIOUS_DEPLOYMENT_MODE" = "sitecontainers" ]; then
            if [ -z "$PREVIOUS_SITECONTAINER_IMAGE" ]; then
              echo "::error::Rollback failed: the previous main sitecontainer image was not captured."
              exit 1
            fi
            if ! az webapp config set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --linux-fx-version "$PREVIOUS_LINUX_FX_VERSION" \
                --output none; then
              echo "::error::Rollback failed: could not restore the SITECONTAINERS runtime."
              exit 1
            fi
            if ! az webapp sitecontainers update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --container-name main \
                --image "$PREVIOUS_SITECONTAINER_IMAGE" \
                --is-main true \
                --output none; then
              echo "::error::Rollback failed: could not restore the previous main sitecontainer image."
              exit 1
            fi
          else
            echo "::error::Rollback failed: the captured deployment mode is unsupported."
            exit 1
          fi

          if [ "$PREVIOUS_BUILD_NUMBER_PRESENT" = true ]; then
            if ! az webapp config appsettings set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --settings "Application__BuildNumber=$PREVIOUS_BUILD_NUMBER" \
                --output none; then
              echo "::error::Rollback failed: could not restore the previous Application__BuildNumber."
              exit 1
            fi
          else
            if ! az webapp config appsettings delete \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --setting-names Application__BuildNumber \
                --output none; then
              echo "::error::Rollback failed: could not remove the previous Application__BuildNumber."
              exit 1
            fi
          fi

          if ! az webapp restart \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --output none; then
            echo "::error::Rollback failed: could not restart the API after restoring the previous deployment."
            exit 1
          fi

          if [ "$PREVIOUS_DEPLOYMENT_MODE" = "classic" ]; then
            if ! restored_runtime_image="$(az webapp config show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --query linuxFxVersion \
              --output tsv)"; then
              echo "::error::Rollback failed: could not verify the restored Docker runtime image."
              exit 1
            fi
          else
            if ! restored_runtime_image="$(az webapp sitecontainers show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --container-name main \
              --query properties.image \
              --output tsv)"; then
              echo "::error::Rollback failed: could not verify the restored main sitecontainer image."
              exit 1
            fi
          fi
          if [ "$PREVIOUS_DEPLOYMENT_MODE" = "classic" ]; then
            if [ "$restored_runtime_image" != "$PREVIOUS_LINUX_FX_VERSION" ]; then
              echo "::error::Rollback failed: Azure is not configured with the captured previous Docker runtime image."
              exit 1
            fi
          elif [ "$restored_runtime_image" != "$PREVIOUS_SITECONTAINER_IMAGE" ]; then
            echo "::error::Rollback failed: Azure is not configured with the captured previous main sitecontainer image."
            exit 1
          fi

          expected_previous_build_number="${PREVIOUS_HEALTH_BUILD_NUMBER:-${PREVIOUS_BUILD_NUMBER:-unknown}}"
          expected_previous_image_id="${PREVIOUS_HEALTH_IMAGE_ID:-}"
          # shellcheck disable=SC2016 # The jq variables intentionally expand inside jq, not Bash.
          if [ -n "$expected_previous_image_id" ]; then
            expected_previous_health_query='.status == "ok" and .buildNumber == $expected_build_number and .imageId == $expected_image_id'
            echo "Rollback health will require the captured previous build and image identity."
          else
            expected_previous_health_query='.status == "ok" and ((.buildNumber // $expected_build_number) == $expected_build_number)'
            echo "::notice::Rollback health is using the explicit legacy-image compatibility path because the pre-deploy health response had no safe embedded image identity; Azure image configuration was matched to the captured reference."
          fi

          if ! default_host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"; then
            echo "::error::Rollback failed: could not resolve the API host after restoring the previous deployment."
            exit 1
          fi
          if [ -z "$default_host_name" ]; then
            echo "::error::Rollback failed: Azure returned no API host after restoring the previous deployment."
            exit 1
          fi

          rollback_health_url="https://$default_host_name/health"
          rollback_health_response_file="$(mktemp)"
          trap 'rm -f "$rollback_health_response_file"' EXIT
          rollback_health_succeeded=false
          stable_rollback_health_probes=0
          for attempt in $(seq 1 30); do
            if http_status="$(curl --silent --show-error --output "$rollback_health_response_file" --write-out '%{http_code}' --max-time 10 "$rollback_health_url")"; then
              if [ "$http_status" = "200" ] && jq -e \
                --arg expected_build_number "$expected_previous_build_number" \
                --arg expected_image_id "$expected_previous_image_id" \
                "$expected_previous_health_query" \
                "$rollback_health_response_file" >/dev/null 2>&1; then
                stable_rollback_health_probes=$((stable_rollback_health_probes + 1))
                if [ "$stable_rollback_health_probes" -ge 2 ]; then
                  rollback_health_succeeded=true
                  echo "Rollback health check passed with HTTP 200 and the expected previous build identity on attempt $attempt."
                  break
                fi
              else
                stable_rollback_health_probes=0
              fi
            else
              http_status=000
              stable_rollback_health_probes=0
            fi

            echo "Rollback health check returned HTTP $http_status or an unexpected build identity (attempt $attempt/30, stable probes $stable_rollback_health_probes/2); retrying."
            sleep 10
          done

          if [ "$rollback_health_succeeded" != true ]; then
            echo "::error::Rollback failed: the previous API deployment did not return HTTP 200 at $rollback_health_url."
            exit 1
          fi

          echo "::error::API health gate failed; restored the previous deployment image and build metadata."
